name: PGC Q3 curl rank and minimal observation

on:
  pull_request:
    paths:
      - 'MathCan/Pregeometry/QuantumDiamond.lean'
      - 'MathCan/Pregeometry/SmithObservation.lean'
      - 'research/pregeometric_identifiability/smith_observation_audit.*'
      - 'MathCan/Pregeometry/Q3Curl.lean'
      - '.github/workflows/pgc-q3-curl.yml'
  push:
    branches:
      - main
    paths:
      - 'MathCan/Pregeometry/Q3Curl.lean'
      - 'MathCan/Pregeometry/QuantumDiamond.lean'
      - 'MathCan/Pregeometry/SmithObservation.lean'
      - 'research/pregeometric_identifiability/smith_observation_audit.*'
      - 'research/pregeometric_identifiability/q3_minimal_observation.py'
      - 'research/pregeometric_identifiability/q3_minimal_observation.json'
      - 'research/arithmetic_holonomy_rotor/ibm_qpu_01/q3_curvature.py'
      - '.github/workflows/pgc-q3-curl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check the finite Q3 curl facts
        run: |
          set -euo pipefail
          lake env lean MathCan/Pregeometry/Q3Curl.lean | tee /tmp/q3curl.log
          ! grep -q "sorry" /tmp/q3curl.log
      - name: Kernel-check quantum diamond Pauli support
        run: |
          set -euo pipefail
          lake env lean MathCan/Pregeometry/QuantumDiamond.lean | tee /tmp/quantumdiamond.log
          ! grep -q "sorry" /tmp/quantumdiamond.log
      - name: Kernel-check certified observation fiber reductions
        run: |
          set -euo pipefail
          lake env lean MathCan/Pregeometry/SmithObservation.lean | tee /tmp/smith-observation.log
          ! grep -q "sorry" /tmp/smith-observation.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay exact Smith and cyclic-grid audit
        run: |
          node research/pregeometric_identifiability/smith_observation_audit.mjs > /tmp/smith-observation.json
          diff -u research/pregeometric_identifiability/smith_observation_audit.json /tmp/smith-observation.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact rank, subset, orientation and Bianchi-projection studies
        run: |
          python -m pip install numpy scipy
          python research/pregeometric_identifiability/q3_minimal_observation.py
