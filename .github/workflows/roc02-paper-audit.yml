name: ROC-02 observer causal paper arithmetic

on:
  push:
    paths:
      - 'papers/roc02/**'
      - '.github/workflows/roc02-paper-audit.yml'
  pull_request:
    paths:
      - 'papers/roc02/**'
      - '.github/workflows/roc02-paper-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify six-seed signed permutation and scope
        run: |
          python -m compileall -q papers/roc02
          python papers/roc02/roc02_primary_signflip_v01.py
          python papers/roc02/roc04a_primary_signflip_v01.py
          python papers/roc02/roc04b_reserved_signflip_v01.py
          python papers/roc02/roc05_fresh_and_causal_signflip_v01.py
          python - <<'PY'
          from pathlib import Path
          import csv
          p=Path("papers/roc02/ROC02_Observer_Causal_Update_v01_20261117.md")
          x=p.read_text()
          assert "0.375" in x and "3/6" in x
          assert "sealed" in x.lower() and "calibration" in x.lower()
          assert len(list(csv.DictReader(open("papers/roc02/ROC02_primary_six_seed_v01.csv")))) == 6
          new=Path("papers/roc02/ROC02_Observer_Causal_Update_v02_20261117.md").read_text()
          assert "version 0.2" in new
          assert "0.015625" in new and "0.4778645833" in new
          assert "4/6" in new and "0/6" in new
          assert "reserved" in new.lower() and "families 6" in new.lower()
          assert len(list(csv.DictReader(open("papers/roc02/ROC04A_primary_six_seed_v01.csv")))) == 6
          assert "ROC02_Observer_Causal_Update_v02_20261117.md" in Path("papers/roc02/README.md").read_text()
          roc04b=Path("papers/roc02/ROC02_Observer_Causal_Update_v03_20261117.md").read_text()
          assert "version 0.3" in roc04b and "0.51953125" in roc04b
          assert "0.015625" in roc04b and "11.89%" in roc04b
          assert "first hosted attempt" in roc04b.lower() and "6–7" in roc04b
          assert "Competence gate" in roc04b or "competence gate" in roc04b
          assert len(list(csv.DictReader(open("papers/roc02/ROC04B_reserved_test_by_seed_v01.csv"))))==6
          idx=Path("papers/roc02/README.md").read_text()
          assert "ROC02_Observer_Causal_Update_v03_20261117.md" in idx
          assert "have now been evaluated" in idx
          latest=Path("papers/roc02/ROC02_Observer_Causal_Update_v04_20261117.md").read_text()
          assert "version 0.4" in latest
          assert "0.5416666667" in latest and "0.015625" in latest
          assert "−0.06805338" in latest and "p=1.0" in latest
          assert "ROC-05B" in latest and "384" in latest
          assert len(list(csv.DictReader(open("papers/roc02/ROC05A_fresh_replication_by_seed_v01.csv"))))==6
          assert len(list(csv.DictReader(open("papers/roc02/ROC05B_causal_primary_by_seed_v01.csv"))))==6
          toc=Path("papers/roc02/README.md").read_text()
          assert "ROC02_Observer_Causal_Update_v04_20261117.md" in toc
          assert "no input examples or labels" in toc.lower()
          PY
