name: NOR-24 exact sequential witness and posterior attack-set count proof

on:
  push:
    paths:
      - 'MathCan/NOR24SequentialWitness.lean'
      - 'MathCan.lean'
      - 'research/nor24/**'
      - '.github/workflows/nor24-sequential-witness-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR24SequentialWitness.lean'
      - 'MathCan.lean'
      - 'research/nor24/**'
      - '.github/workflows/nor24-sequential-witness-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequential-audit-trace-and-binomial-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel check transcript identity, conditional counts, posterior partition and axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR24SequentialWitness.lean | tee nor24-sequential-witness-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor24-sequential-witness-axioms.txt; then
            echo 'NOR24 unexpected admitted proof, compilation error or reduction marker'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor24-sequential-witness-lean-kernel-axioms
          path: nor24-sequential-witness-axioms.txt
