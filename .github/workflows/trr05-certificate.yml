name: TRR-05 exact interpolation certificates
on:
  pull_request:
    paths:
      - 'research/translation_rank_rigidity/trr05/**'
      - '.github/workflows/trr05-certificate.yml'
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact certificates
        run: node research/translation_rank_rigidity/trr05/verify.mjs research/translation_rank_rigidity/trr05/certificate.json
