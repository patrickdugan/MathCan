name: NOR-18R exact reciprocal reuse and public verifier parity in Lean

on:
  push:
    paths:
      - 'MathCan/NOR18RReciprocalReuse.lean'
      - 'MathCan.lean'
      - 'research/nor18r/**'
      - '.github/workflows/nor18r-reciprocal-reuse.yml'
  pull_request:
    paths:
      - 'MathCan/NOR18RReciprocalReuse.lean'
      - 'MathCan.lean'
      - 'research/nor18r/**'
      - '.github/workflows/nor18r-reciprocal-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reciprocal-batched-public-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Compile exact native/cached R call counts and prefix/full mask theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR18RReciprocalReuse.lean | tee nor18r-reciprocal-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor18r-reciprocal-axioms.txt; then
            echo 'Admitted proof, native reduction or compilation error'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor18r-reciprocal-counts-prefix-parity-lean-axioms
          path: nor18r-reciprocal-axioms.txt
