name: VPVNP-02I rank one character
on:
  pull_request:
    paths:
      - 'research/VPVNP/RankOneCharacter.lean'
      - 'research/VPVNP/CanonicalRankRecurrence.lean'
      - 'research/VPVNP/rank_one_check.py'
      - '.github/workflows/vpvnp02i-rank-one.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpvnp02i-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Native rank-one distribution and axiom gate
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP/{RankSpectral,BinaryWalsh,HyperplaneCancellation,OrderedFrameFibers,SignedFrameTransport,MatrixRankCharacter,CanonicalRankRecurrence,RankOneCharacter}.lean .
          lake env bash -c 'set -euo pipefail; export LEAN_PATH="$PWD:$LEAN_PATH"; for m in RankSpectral BinaryWalsh HyperplaneCancellation OrderedFrameFibers SignedFrameTransport MatrixRankCharacter CanonicalRankRecurrence; do lean -o "$m.olean" "$m.lean"; done; lean RankOneCharacter.lean' | tee "$RUNNER_TEMP/vpvnp02i-axioms.txt"
          python3 - "$RUNNER_TEMP/vpvnp02i-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set("nzVec_card matrix_rank_zero_imp_zero outer_rank_one outer_injective outer_surjective outerEquiv rank_one_card outer_pairing walsh_full_sum kernel_dim kernel_vector_card outer_full_sum rank_one_signed rank_one_odd_formula".split())
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'VPVNP\.Binary\.([\w]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'VPVNP\.Binary\.([\w]+)' does not depend on any axioms",s):
              found.add(name)
          assert expected <= found,(found,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpvnp02i-native-axioms
          path: ${{ runner.temp }}/vpvnp02i-axioms.txt
  exact-rank-one:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate outer products and all dual coefficients
        shell: bash
        run: |
          set -euo pipefail
          python3 research/VPVNP/rank_one_check.py | tee "$RUNNER_TEMP/vpvnp02i-rank-one.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vpvnp02i-exact-rank-one
          path: ${{ runner.temp }}/vpvnp02i-rank-one.json
