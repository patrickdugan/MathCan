name: NOR-34 eight-atom hypergeometric quota count and matching Lean kernel

on:
  push:
    paths:
      - 'MathCan/NOR34EightAtomMatchedCoverage.lean'
      - 'MathCan.lean'
      - 'research/nor34/**'
      - '.github/workflows/nor34-eight-atom-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR34EightAtomMatchedCoverage.lean'
      - 'MathCan.lean'
      - 'research/nor34/**'
      - '.github/workflows/nor34-eight-atom-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-atom-count-and-coarse-insufficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check exact quota-conditioned eight-atom numerator/denominator and axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR34EightAtomMatchedCoverage.lean | tee nor34-eight-atom-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor34-eight-atom-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor34-eight-atom-hypergeometric-axiom-inventory
          path: nor34-eight-atom-axioms.txt
