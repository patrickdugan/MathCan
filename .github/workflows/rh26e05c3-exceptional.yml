name: RH-26E-05C3 exceptional-prime certificates

on:
  push:
    branches: [research/rh26-extraction-rubrics-20261123]
    paths:
      - 'research/rh26/lean/RH26E05C3Exceptional.lean'
      - 'research/rh26/RH26E05C3_REGISTRATION.md'
      - '.github/workflows/rh26e05c3-exceptional.yml'
  workflow_dispatch:

concurrency:
  group: rh26e05c3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exceptional-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify registration and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.35.0' experiments/deligne_mathlib/lean-toolchain
          grep -Fx 'rev = "v4.35.0"' experiments/deligne_mathlib/lakefile.toml
          test -s research/rh26/RH26E05C3_REGISTRATION.md
          test -s research/rh26/lean/RH26E05C3Exceptional.lean
          if grep -En '^[[:space:]]*(axiom|sorry|admit|unsafe|opaque)[[:space:]]' research/rh26/lean/RH26E05C3Exceptional.lean; then
            echo "::error::Forbidden declaration in source"
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve Mathlib v4.35.0
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check all eighteen registered declarations
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/rh26e05c3
          lean --version | tee ../../artifacts/rh26e05c3/lean-version.txt
          grep -F 'Lean (version 4.35.0' ../../artifacts/rh26e05c3/lean-version.txt
          git -C .lake/packages/mathlib rev-parse HEAD | tee ../../artifacts/rh26e05c3/mathlib-sha.txt
          sha256sum ../../research/rh26/lean/RH26E05C3Exceptional.lean | tee ../../artifacts/rh26e05c3/source-sha256.txt
          /usr/bin/time -v -o ../../artifacts/rh26e05c3/timing.txt lake env lean ../../research/rh26/lean/RH26E05C3Exceptional.lean 2>&1 | tee ../../artifacts/rh26e05c3/axiom-audit.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("../../artifacts/rh26e05c3/axiom-audit.txt").read_text()
          names = {
              "cutoff_ratio", "denominator_envelope", "exceptional_divisions",
              "ep_bound", "flat_bound", "bb_bound", "split_length", "inert_length",
              "exceptional_gap_identity", "exceptional_envelope", "exceptional_integer_minimum",
              "pointwise_assembly", "count_mixed_bound", "count_envelope",
              "prime_log_bound", "exceptional_sum", "exceptional_absorption",
              "missing_scale_controls",
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          assert "sorryAx" not in log and "ofReduceBool" not in log
          assert not re.search(r"declaration uses 'sorry'", log)
          found = {}
          for line in log.splitlines():
              m = re.match(r"'RH26E05C3\.([A-Za-z0-9_]+)' depends on axioms: \[([^]]*)\]$", line.strip())
              if m:
                  name = m.group(1)
                  deps = {s.strip() for s in m.group(2).split(",") if s.strip()}
              else:
                  m = re.match(r"'RH26E05C3\.([A-Za-z0-9_]+)' does not depend on any axioms$", line.strip())
                  if not m:
                      continue
                  name, deps = m.group(1), set()
              assert name not in found, f"duplicate audit: {name}"
              assert deps <= allowed, f"unexpected axiom(s) in {name}: {deps - allowed}"
              found[name] = deps
          assert found.keys() == names, f"missing={names-found.keys()} extra={found.keys()-names}"
          print(f"RH-26E-05C3: {len(found)} registered declarations typechecked and axiom-audited")
          PY
          cat ../../artifacts/rh26e05c3/timing.txt
      - name: Preserve kernel receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh26e05c3-lean435-kernel-receipts
          path: artifacts/rh26e05c3/
          if-no-files-found: warn
          retention-days: 30
