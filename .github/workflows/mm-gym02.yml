name: MM-GYM-02 real set.mm proof traces
on:
  pull_request:
    paths:
      - 'research/metamath_gym/**'
      - '.github/workflows/mm-gym02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit controls
        run: python -m unittest discover -s research/metamath_gym -p 'test_*.py' -v
      - name: Fetch frozen sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/metamath/set.mm/806509385370b29fe8b1723804777ac21b1ce194/set.mm -o "$RUNNER_TEMP/set.mm"
          curl -fsSL https://raw.githubusercontent.com/david-a-wheeler/mmverify.py/63a2aa3815cd5bf67892dbfc7f2048cbb177524c/mmverify.py -o "$RUNNER_TEMP/mmverify.py"
          git init "$RUNNER_TEMP/metamath-exe"
          git -C "$RUNNER_TEMP/metamath-exe" fetch --depth=1 https://github.com/metamath/metamath-exe.git 580b4bd5ae6f2a0d746398b0033cddccba1b418b
          git -C "$RUNNER_TEMP/metamath-exe" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/metamath-exe" rev-parse HEAD)" = 580b4bd5ae6f2a0d746398b0033cddccba1b418b
          cd "$RUNNER_TEMP/metamath-exe/src"
          gcc m*.c -o metamath
      - name: Extract and replay first 600 proofs
        run: python research/metamath_gym/setmm_corpus.py "$RUNNER_TEMP/mmverify.py" "$RUNNER_TEMP/set.mm" "$RUNNER_TEMP/mm02"
      - name: Independent replay of rewritten prefix
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/mmverify.py" "$RUNNER_TEMP/mm02/expanded-prefix.mm" -v 1 2>&1 | tee "$RUNNER_TEMP/mm02/expanded-python.log"
          grep -Fq 'No errors were found.' "$RUNNER_TEMP/mm02/expanded-python.log"
          PYTHONPATH=research/metamath_gym python -c 'import sys,json; from pathlib import Path; from c_differential import check,digest; e,p=map(Path,sys.argv[1:]); print(json.dumps({"verifier_sha256":digest(e),"certificate":check(e,p,True)}))' "$RUNNER_TEMP/metamath-exe/src/metamath" "$RUNNER_TEMP/mm02/expanded-prefix.mm" | tee "$RUNNER_TEMP/mm02/expanded-c.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-gym02-corpus
          path: ${{ runner.temp }}/mm02
