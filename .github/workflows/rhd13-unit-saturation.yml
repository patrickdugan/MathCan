name: RHD-13 finite unit saturation and Lean kernel

on:
  push:
    paths:
      - 'MathCan/RHFiniteUnitObstructions.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/rhd13_unit_bridge.py'
      - 'research/rh_proof_distillation/RHD13_UNIT_SATURATION.md'
      - 'tests/test_rhd13_unit_bridge.py'
      - '.github/workflows/rhd13-unit-saturation.yml'
  pull_request:
    paths:
      - 'MathCan/RHFiniteUnitObstructions.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/rhd13_unit_bridge.py'
      - 'research/rh_proof_distillation/RHD13_UNIT_SATURATION.md'
      - 'tests/test_rhd13_unit_bridge.py'
      - '.github/workflows/rhd13-unit-saturation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-parity-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay both cyclotomic unit generators and eight finite annihilator tests
        run: python -m unittest tests.test_rhd10_unit_obstruction tests.test_rhd11_crossfamily tests.test_rhd13_unit_bridge -v
      - name: Generate reproducible unit bridge and SHA-256 receipt
        run: |
          mkdir -p rhd13
          python -m research.rh_proof_distillation.rhd13_unit_bridge --output rhd13/unit_bridge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd13-unit-parity-receipts
          path: rhd13/
          if-no-files-found: ignore

  finite-unit-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit finite p5 and p29 annihilator proofs and axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHFiniteUnitObstructions.lean | tee rhd13-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd13-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd13-finite-lean-axioms
          path: rhd13-axioms.txt
          if-no-files-found: ignore
