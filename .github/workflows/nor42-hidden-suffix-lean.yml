name: NOR-42 late-suffix public-prefix and future indistinguishability Lean kernel

on:
  push:
    branches:
      - research/nor42-hidden-suffix-indistinguishability-20261118
    paths:
      - 'MathCan/NOR42HiddenSuffix.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor42-hidden-suffix-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR42HiddenSuffix.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor42-hidden-suffix-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_public_prefix_indistinguishability:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel verify hidden-future separation and inspect axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR42HiddenSuffix.lean | tee nor42-hidden-suffix-axioms.txt
          if grep -Eq 'sorryAx|^error:|admit' nor42-hidden-suffix-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor42-hidden-suffix-kernel-axioms
          path: nor42-hidden-suffix-axioms.txt
