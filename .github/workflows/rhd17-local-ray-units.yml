name: RHD-17 exhaustive local ray-unit quotient and Lean proofs

on:
  push:
    paths:
      - 'MathCan/RHLocalRayUnits.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/rhd17_local_ray_units.py'
      - 'research/rh_proof_distillation/RHD17_LOCAL_RAY_UNITS.md'
      - 'tests/test_rhd17_local_ray_units.py'
      - '.github/workflows/rhd17-local-ray-units.yml'
  pull_request:
    paths:
      - 'MathCan/RHLocalRayUnits.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/rhd17_local_ray_units.py'
      - 'research/rh_proof_distillation/RHD17_LOCAL_RAY_UNITS.md'
      - 'tests/test_rhd17_local_ray_units.py'
      - '.github/workflows/rhd17-local-ray-units.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive-finite-local-rings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify primitive roots, character multiplicativity, and all 2,831,624 ring inputs
        run: python -m unittest tests.test_rhd17_local_ray_units -v
      - name: Emit audited finite ray quotient counts and SHA-256
        run: |
          mkdir -p rhd17
          python -m research.rh_proof_distillation.rhd17_local_ray_units --output rhd17/local_ray_units.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd17-local-ray-quotient-receipts
          path: rhd17/
          if-no-files-found: ignore

  kernel-local-ray-units:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify all eight root powers and abstract character descent
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHLocalRayUnits.lean | tee rhd17-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd17-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd17-finite-lean-axioms
          path: rhd17-axioms.txt
          if-no-files-found: ignore
