name: NHB-01 noise horizon kernel checks
permissions:
  contents: read
on:
  push:
    paths:
      - 'MathCan/NoisyHorizon.lean'
      - '.github/workflows/nhb01-noisy-horizon.yml'
  pull_request:
    paths:
      - 'MathCan/NoisyHorizon.lean'
      - '.github/workflows/nhb01-noisy-horizon.yml'
  workflow_dispatch:
jobs:
  noisy-horizon-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check new standalone module with pinned Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NoisyHorizon.lean | tee nhb01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' nhb01-axioms.txt; then
            echo 'Admitted proof or native reduction axiom detected.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nhb01-lean-axioms
          path: nhb01-axioms.txt
