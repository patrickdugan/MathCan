name: VPVNP-02G matrix rank characters
# Historical per-stage gate; consolidated proof workflow runs on the PR.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: vpvnp02g-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check trace rank invariance and axiom gate
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP/{RankSpectral,BinaryWalsh,HyperplaneCancellation,OrderedFrameFibers,SignedFrameTransport,MatrixRankCharacter}.lean .
          lake env bash -c 'set -euo pipefail; export LEAN_PATH="$PWD:$LEAN_PATH"; for m in RankSpectral BinaryWalsh HyperplaneCancellation OrderedFrameFibers SignedFrameTransport; do lean -o "$m.olean" "$m.lean"; done; lean MatrixRankCharacter.lean' | tee "$RUNNER_TEMP/vpvnp02g-axioms.txt"
          python3 - "$RUNNER_TEMP/vpvnp02g-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set("trace_character_cycle trace_average_mul_units trace_reindex trace_character_reindex trace_average_reindex trace_average_rank_block trace_average_rank_invariant entry_pairing_trace entry_average_trace entry_average_rank_invariant".split())
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'VPVNP\.Binary\.([\w]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'VPVNP\.Binary\.([\w]+)' does not depend on any axioms",s):
              found.add(name)
          assert expected <= found,(found,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpvnp02g-native-axioms
          path: ${{ runner.temp }}/vpvnp02g-axioms.txt
  exact-full-walsh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every dual coefficient through dimension four
        shell: bash
        run: |
          set -euo pipefail
          python3 research/VPVNP/full_walsh_audit.py | tee "$RUNNER_TEMP/vpvnp02g-full-walsh.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vpvnp02g-exact-walsh
          path: ${{ runner.temp }}/vpvnp02g-full-walsh.json
