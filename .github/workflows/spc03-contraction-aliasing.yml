name: SPC-03 exact anchors and contraction algebra
on:
  push:
    paths:
      - 'MathCan/ContractionAliasing.lean'
      - 'MathCan.lean'
      - 'research/spectral_aliasing/SPC-03.md'
      - 'tests/test_contraction_aliasing.py'
      - '.github/workflows/spc03-contraction-aliasing.yml'
  pull_request:
    paths:
      - 'MathCan/ContractionAliasing.lean'
      - 'MathCan.lean'
      - 'research/spectral_aliasing/SPC-03.md'
      - 'tests/test_contraction_aliasing.py'
      - '.github/workflows/spc03-contraction-aliasing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_contraction_aliasing.py' -v
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-level theorem and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/ContractionAliasing.lean | tee spc03-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' spc03-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spc03-axiom-audit
          path: spc03-axioms.txt
