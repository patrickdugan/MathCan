name: NOR-06 finite basin capture Lean gate

on:
  pull_request:
    paths:
      - 'MathCan/BasinCapture.lean'
      - 'MathCan.lean'
      - 'research/nor06/**'
      - '.github/workflows/nor06-basin-capture.yml'
  push:
    paths:
      - 'MathCan/BasinCapture.lean'
      - 'MathCan.lean'
      - 'research/nor06/**'
      - '.github/workflows/nor06-basin-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captured-state-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Print NOR-06 transitive axioms and reject admissions
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/BasinCapture.lean | tee nor06-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' nor06-axioms.txt; then
            echo 'Detected admitted proof or native reduction axiom'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor06-basin-capture-lean-axioms
          path: nor06-axioms.txt
