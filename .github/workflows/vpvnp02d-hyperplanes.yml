name: VPVNP-02D hyperplane cancellation
on:
  pull_request:
    paths:
      - 'research/VPVNP/HyperplaneCancellation.lean'
      - 'research/VPVNP/hyperplane_check.py'
      - 'research/VPVNP/BinaryWalsh.lean'
      - '.github/workflows/vpvnp02d-hyperplanes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpvnp02d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Native hyperplane proof and axiom gate
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP/{RankSpectral,BinaryWalsh,HyperplaneCancellation}.lean .
          lake env bash -c 'set -euo pipefail; export LEAN_PATH="$PWD:$LEAN_PATH"; lean -o RankSpectral.olean RankSpectral.lean; lean -o BinaryWalsh.olean BinaryWalsh.lean; lean HyperplaneCancellation.lean' | tee "$RUNNER_TEMP/vpvnp02d-axioms.txt"
          python3 - "$RUNNER_TEMP/vpvnp02d-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set("kernel_injective hyperplane_count kernel_annihilator kernel_separates outside_cancel outside_same outside_half final_mean uniform_normal_reduction restriction_detects_zero".split())
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'VPVNP\.Binary\.([\w]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'VPVNP\.Binary\.([\w]+)' does not depend on any axioms",s):
              found.add(name)
          assert expected <= found,(found,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpvnp02d-native-axioms
          path: ${{ runner.temp }}/vpvnp02d-axioms.txt
  exact-hyperplanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: All normal pairs through dimension six
        shell: bash
        run: |
          set -euo pipefail
          python3 research/VPVNP/hyperplane_check.py | tee "$RUNNER_TEMP/vpvnp02d-hyperplanes.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vpvnp02d-exact-hyperplanes
          path: ${{ runner.temp }}/vpvnp02d-hyperplanes.json
