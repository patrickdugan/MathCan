name: CLN-02 Mathlib prime-power and Fourier kernel
on:
  pull_request:
    paths:
      - 'research/cantor_liouville/mathlib/**'
      - '.github/workflows/cln02-mathlib.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/cantor_liouville/mathlib
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean via elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib and cache
        run: |
          lake update
          lake exe cache get Mathlib.NumberTheory.Multiplicity Mathlib.Analysis.SpecialFunctions.Complex.CircleAddChar Mathlib.Algebra.Group.AddChar Mathlib.Data.ZMod.Basic Mathlib.GroupTheory.OrderOfElement Mathlib.Tactic
      - name: Kernel and axiom audit
        run: |
          set -o pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)[[:space:]]' CLN02.lean; then exit 1; fi
          lake env lean CLN02.lean 2>&1 | tee cln02-kernel.log
          if grep -E 'sorryAx|declaration uses .sorry.' cln02-kernel.log; then exit 1; fi
          test "$(grep -c 'depends on axioms' cln02-kernel.log)" -eq 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cln02-kernel-log
          path: research/cantor_liouville/mathlib/cln02-kernel.log
