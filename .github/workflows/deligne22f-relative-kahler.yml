name: DEL-22F relative Kaehler universal section presentation

on:
  push:
    branches: [proof/deligne22f-relative-kahler-presentation-20261123]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/RelativeSectionKahler.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'tests/test_deligne22f_relative_kahler.py'
      - 'research/deligne_sign_audit/DEL22F_*'
      - '.github/workflows/deligne22f-relative-kahler.yml'
  workflow_dispatch:

concurrency:
  group: deligne22f-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check relative Kaehler and full Deligne04 imports
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/RelativeSectionKahler.lean | tee deligne22f-kahler-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne22f-kahler-axioms.txt; then
            echo 'DEL-22F unexpected axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay original relative scheme regression oracles
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_deligne22f_relative_kahler tests.test_deligne22e_schur_numerator tests.test_deligne22c_rankd_pivot tests.test_deligne22b_universal_section tests.test_deligne22a_relative_critical
