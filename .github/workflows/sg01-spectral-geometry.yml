name: SG-01 finite spectral geometry
on:
  pull_request:
    paths:
      - "MathCan/SpectralGeometry.lean"
      - ".github/workflows/sg01-spectral-geometry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Retrieve pinned Mathlib 4.35 and compiled cache
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and report axioms
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake env lean "$GITHUB_WORKSPACE/MathCan/SpectralGeometry.lean" 2>&1 | tee "$GITHUB_WORKSPACE/sg01-kernel.log"
          if grep -q 'sorryAx' "$GITHUB_WORKSPACE/sg01-kernel.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sg01-kernel-receipt
          path: sg01-kernel.log
