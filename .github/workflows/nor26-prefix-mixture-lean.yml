name: NOR-26 policy-aware prefix mixture Lean kernel

on:
  push:
    paths:
      - 'MathCan/NOR26RandomPrefixGame.lean'
      - 'MathCan.lean'
      - 'research/nor26/**'
      - '.github/workflows/nor26-prefix-mixture-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR26RandomPrefixGame.lean'
      - 'MathCan.lean'
      - 'research/nor26/**'
      - '.github/workflows/nor26-prefix-mixture-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrated-prefix-mixture-kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify finite mixture and calibrated-policy Lean proofs with axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR26RandomPrefixGame.lean | tee nor26-prefix-mixture-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor26-prefix-mixture-axioms.txt; then
            echo 'NOR26 Lean kernel or axiom failure'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor26-prefix-mixture-kernel-axioms
          path: nor26-prefix-mixture-axioms.txt
