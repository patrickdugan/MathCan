name: NOR-15 finite-resolution trajectory observability Lean theorem

on:
  push:
    paths:
      - 'MathCan/NOR15TrajectoryObservability.lean'
      - 'MathCan.lean'
      - 'research/nor15/**'
      - '.github/workflows/nor15-trajectory-observability.yml'
  pull_request:
    paths:
      - 'MathCan/NOR15TrajectoryObservability.lean'
      - 'MathCan.lean'
      - 'research/nor15/**'
      - '.github/workflows/nor15-trajectory-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-resolution-pair-lower-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Inspect axioms and compile all five NOR-15 observability theorems
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR15TrajectoryObservability.lean | tee nor15-trajectory-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor15-trajectory-axioms.txt; then
            echo 'NOR-15 kernel proof uses an inadmissible axiom or has an error'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor15-trajectory-observability-lean-axioms
          path: nor15-trajectory-axioms.txt
