name: TRR-01 translation rank rigidity

on:
  pull_request:
    paths:
      - 'MathCan/TranslationRankRigidity.lean'
      - 'research/translation_rank_rigidity/**'
      - '.github/workflows/trr01-translation-rank.yml'
  push:
    branches: [main]
    paths:
      - 'MathCan/TranslationRankRigidity.lean'
      - 'research/translation_rank_rigidity/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate independent exact receipt
        run: |
          python research/translation_rank_rigidity/verify_rigidity.py
          python research/translation_rank_rigidity/trr02/verify_min_rank.py
          git diff --exit-code -- research/translation_rank_rigidity/receipt.json research/translation_rank_rigidity/trr02/receipt.json
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check candidate and transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/TranslationRankRigidity.lean | tee trr01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' trr01-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: trr01-axioms
          path: trr01-axioms.txt
