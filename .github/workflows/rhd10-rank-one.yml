name: RHD-10 rank-one eigenline and finite repair gym

on:
  push:
    paths:
      - 'MathCan/RHRankOneEigenline.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/RHD10_RANK_ONE_EIGENLINE.md'
      - 'research/rh_proof_distillation/rhd10_rank_one_repair.py'
      - 'tests/test_rhd10_rank_one_repair.py'
      - 'research/rh_proof_distillation/rhd10_policy_eval.py'
      - 'tests/test_rhd10_policy_eval.py'
      - 'research/rh_proof_distillation/rhd10_unit_obstruction.py'
      - 'tests/test_rhd10_unit_obstruction.py'
      - 'research/rh_proof_distillation/RHD10C_UNIT_OBSTRUCTION.md'
      - 'research/rh_proof_distillation/RHD10B_POLICY_EVAL.md'
      - '.github/workflows/rhd10-rank-one.yml'
  pull_request:
    paths:
      - 'MathCan/RHRankOneEigenline.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/RHD10_RANK_ONE_EIGENLINE.md'
      - 'research/rh_proof_distillation/rhd10_rank_one_repair.py'
      - 'tests/test_rhd10_rank_one_repair.py'
      - 'research/rh_proof_distillation/rhd10_policy_eval.py'
      - 'tests/test_rhd10_policy_eval.py'
      - 'research/rh_proof_distillation/rhd10_unit_obstruction.py'
      - 'tests/test_rhd10_unit_obstruction.py'
      - 'research/rh_proof_distillation/RHD10C_UNIT_OBSTRUCTION.md'
      - 'research/rh_proof_distillation/RHD10B_POLICY_EVAL.md'
      - '.github/workflows/rhd10-rank-one.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-repair-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify finite character and all-root recurrent repair
        run: |
          python -m unittest tests.test_rhd09_local_character tests.test_rhd10_rank_one_repair tests.test_rhd10_policy_eval tests.test_rhd10_unit_obstruction -v
      - name: Generate JSONL and content-addressed manifest
        run: |
          mkdir -p rhd10
          python -m research.rh_proof_distillation.rhd10_rank_one_repair --output rhd10/rank_one_repair.jsonl
          python -m research.rh_proof_distillation.rhd10_policy_eval --output rhd10/policy_eval.json
          python -m research.rh_proof_distillation.rhd10_unit_obstruction --output rhd10/unit_obstruction.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd10-finite-repair-receipts
          path: rhd10/
          if-no-files-found: ignore

  abstract-eigenline-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit the independent group-character eigenline and axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHRankOneEigenline.lean | tee rhd10-eigenline-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd10-eigenline-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd10-eigenline-axioms
          path: rhd10-eigenline-axioms.txt
          if-no-files-found: ignore
