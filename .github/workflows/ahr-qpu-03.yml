name: AHR-QPU-03 offline calibration and Qiskit checks

on:
  pull_request:
    paths:
      - 'research/arithmetic_holonomy_rotor/ibm_qpu_03/**'
      - 'research/arithmetic_holonomy_rotor/ibm_qpu_01/**'
      - '.github/workflows/ahr-qpu-03.yml'
  push:
    branches: [main]
    paths:
      - 'research/arithmetic_holonomy_rotor/ibm_qpu_03/**'
      - '.github/workflows/ahr-qpu-03.yml'

permissions:
  contents: read

jobs:
  offline-qiskit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/arithmetic_holonomy_rotor/ibm_qpu_03
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/arithmetic_holonomy_rotor/ibm_qpu_03/requirements.txt
      - name: Install pinned experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Check mathematics, archived counts, and native compilation
        run: python -m pytest -q tests
      - name: Exercise simulator and regenerate a smoke-test manifest
        run: python run_study.py --quick --snapshot receipts/calibration.json --out /tmp/ahr-qpu-03-ci
