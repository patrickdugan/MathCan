name: PLC-01 planar L1 cut-gap Lean checks
permissions:
  contents: read
on:
  push:
    paths:
      - 'MathCan/PlanarCutGap.lean'
      - '.github/workflows/plc01-planar-gap.yml'
  pull_request:
    paths:
      - 'MathCan/PlanarCutGap.lean'
      - '.github/workflows/plc01-planar-gap.yml'
  workflow_dispatch:
jobs:
  planar-cut-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Compile standalone planar SDP proof and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PlanarCutGap.lean | tee plc01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' plc01-axioms.txt; then
            echo 'Admitted or native-reduction axiom detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plc01-lean-axioms
          path: plc01-axioms.txt
