name: MathCan mathematical checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rational-oracles:
    name: Standard-library rational oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact finite checks
        run: python -m unittest discover -s tests -v
      - name: Run Graham-Carrot legacy check
        run: python graham-carrot/verify.py

  lean-kernel:
    name: Lean 4 kernel and axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Print and check transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/Intervention.lean | tee mathcan-axioms.txt
          lake env lean MathCan/Hodge.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/HookState.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/FundedHooks.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/Settlement.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/FlashAccounting.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/V4Transient.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/HookMultiTick.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/FoundryProbe.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/OpcodeRefinement.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEGraph.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOECosmology.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEFLRW.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEDressedMatter.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOETensorCompletion.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOECovariantGates.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOETwoFormTriad.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOETwoMultiplet.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEYangMills.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOELorentzBivector.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOENonAbelian.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEMixedPrincipal.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEJordan.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEFormSectors.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEConeMatching.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOETensorConstraints.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOEMultipletKinetics.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/TOETripletJordan.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/FiniteHorizonGap.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/DeletionMemory.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/GraphAuthorization.lean | tee -a mathcan-axioms.txt
          lake env lean MathCan/FourierBlockProbe.lean | tee -a mathcan-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' mathcan-axioms.txt; then
            echo 'Admitted proof or native reduction axiom detected.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mathcan-axioms
          path: mathcan-axioms.txt
