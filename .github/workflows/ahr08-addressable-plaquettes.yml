name: AHR-08 intact-cube curvature oracle

on:
  pull_request:
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr08/**'
      - '.github/workflows/ahr08-addressable-plaquettes.yml'
  push:
    branches: [main]
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr08/**'
      - '.github/workflows/ahr08-addressable-plaquettes.yml'

permissions:
  contents: read

jobs:
  plaquette-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify AHR-08 geometric addressability and Richardson cancellation
        run: python research/arithmetic_holonomy_rotor/ahr08/ahr08_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: ahr08-local-plaquette-validation
          path: research/arithmetic_holonomy_rotor/ahr08/ahr08_ci_validation.json
          retention-days: 30
