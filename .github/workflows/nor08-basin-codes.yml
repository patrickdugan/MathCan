name: NOR-08 finite basin code capacity Lean gate

on:
  push:
    paths:
      - 'MathCan/BasinCodes.lean'
      - 'MathCan.lean'
      - 'research/nor08/**'
      - '.github/workflows/nor08-basin-codes.yml'
  pull_request:
    paths:
      - 'MathCan/BasinCodes.lean'
      - 'MathCan.lean'
      - 'research/nor08/**'
      - '.github/workflows/nor08-basin-codes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metric-label-injectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit generic basin-code injectivity proofs
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/BasinCodes.lean | tee nor08-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' nor08-axioms.txt; then
            echo 'Admitted proof or native reduction axiom detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor08-basin-code-lean-axioms
          path: nor08-axioms.txt
