name: DETFACT-15 streamed modular exponent semantics
on:
  push:
    paths: ['MathCan/DETFACT15Stream.lean', 'research/cogentic_deterministic_factoring/stream_semantics_audit.py', '.github/workflows/detfact15-stream-lean.yml']
  pull_request:
    paths: ['MathCan/DETFACT15Stream.lean', 'research/cogentic_deterministic_factoring/stream_semantics_audit.py', '.github/workflows/detfact15-stream-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-and-exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check standalone streamed exponent lemmas and axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/DETFACT15Stream.lean | tee detfact15-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|declaration uses .sorry.' detfact15-axioms.txt; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact modular traces and packing boundaries
        run: python research/cogentic_deterministic_factoring/stream_semantics_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: detfact15-axioms
          path: detfact15-axioms.txt
