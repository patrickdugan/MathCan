name: NOR-28 binding-before-entropy exact Lean kernel

on:
  push:
    paths:
      - 'MathCan/NOR28CommitBeforeEntropy.lean'
      - 'MathCan.lean'
      - 'research/nor28/**'
      - '.github/workflows/nor28-commit-entropy-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR28CommitBeforeEntropy.lean'
      - 'MathCan.lean'
      - 'research/nor28/**'
      - '.github/workflows/nor28-commit-entropy-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-nonanticipation-and-blind-audit-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check abstract hash binding, leak invariance and schedule-visible transcript construction
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR28CommitBeforeEntropy.lean | tee nor28-commit-entropy-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor28-commit-entropy-axioms.txt; then
            echo 'NOR28 kernel failure or unexpected admission'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor28-commit-entropy-kernel-axiom-inventory
          path: nor28-commit-entropy-axioms.txt
