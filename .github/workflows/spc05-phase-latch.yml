name: SPC-05 exact phase-latch algebra and contrast certificates
on:
  push:
    paths:
      - 'MathCan/PhaseLatch.lean'
      - 'MathCan.lean'
      - 'research/spectral_aliasing/SPC-05.md'
      - 'tests/test_phase_latch.py'
      - '.github/workflows/spc05-phase-latch.yml'
  pull_request:
    paths:
      - 'MathCan/PhaseLatch.lean'
      - 'MathCan.lean'
      - 'research/spectral_aliasing/SPC-05.md'
      - 'tests/test_phase_latch.py'
      - '.github/workflows/spc05-phase-latch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rational-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python -m unittest discover -s tests -p 'test_phase_latch.py' -v
  lean-checked-phase-latch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit new SPC-05 finite modules
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PhaseLatch.lean | tee spc05-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' spc05-axioms.txt; then exit 1; fi
