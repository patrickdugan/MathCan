name: NOR-31 policy alias quotient and constrained mixture Lean kernel

on:
  push:
    paths:
      - 'MathCan/NOR31ClassCollapsedMinimax.lean'
      - 'MathCan.lean'
      - 'research/nor31/**'
      - '.github/workflows/nor31-class-quotient-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR31ClassCollapsedMinimax.lean'
      - 'MathCan.lean'
      - 'research/nor31/**'
      - '.github/workflows/nor31-class-quotient-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-permutation-and-template-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify uniform-permutation class quotient and template-aware mixture bounds
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR31ClassCollapsedMinimax.lean | tee nor31-class-quotient-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor31-class-quotient-axioms.txt; then
            echo "NOR31 admitted axiom or incomplete proof"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor31-policy-class-quotient-lean-axioms
          path: nor31-class-quotient-axioms.txt
