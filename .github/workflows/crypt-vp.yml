name: CRYPT-VP quantum observer
on:
  pull_request:
    paths:
      - 'research/CRYPT_VP/**'
      - '.github/workflows/crypt-vp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypt-vp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify inherited proof and quantum extension
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP/*.lean .
          cp ../../research/CRYPT_VP/QuantumObserver.lean ../../research/CRYPT_VP/Resampling.lean .
          lake env bash -c 'set -euo pipefail; export LEAN_PATH="$PWD:$LEAN_PATH"; for m in RankSpectral BinaryWalsh HyperplaneCancellation OrderedFrameFibers SignedFrameTransport MatrixRankCharacter CanonicalRankRecurrence RankOneCharacter ObserverBound QuantumObserver Resampling; do lean -o "$m.olean" "$m.lean"; done' | tee "$RUNNER_TEMP/crypt-vp-axioms.txt"
          python3 - "$RUNNER_TEMP/crypt-vp-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          mods="RankSpectral BinaryWalsh HyperplaneCancellation OrderedFrameFibers SignedFrameTransport MatrixRankCharacter CanonicalRankRecurrence RankOneCharacter ObserverBound QuantumObserver Resampling".split()
          expected=set()
          for mod in mods:
              expected.update(re.findall(r"^#print axioms ([\w.]+)",Path(mod+".lean").read_text(),re.M))
          required={"VPVNP.Binary."+x for x in ("hs_shift_coords","hs_energy_coords","hs_sharp_bound","hs_sharp_defect","phase_entry_frequency")}
          required.update("CRYPTVP."+x for x in ("weighted_cost_le","empirical_mixture_le","list_weight_nonneg","product_weight_le","bad_mass_bound","planted_recovery_sum"))
          assert required <= expected
          assert len(expected)>=100
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'([\w.]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'([\w.]+)' does not depend on any axioms",s):
              found.add(name)
          assert expected==found,(expected-found,found-expected)
          print("PASS",len(found),"named axiom receipts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-vp-native-axioms
          path: ${{ runner.temp }}/crypt-vp-axioms.txt
  exact-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay frozen phase and copy experiment
        shell: bash
        run: |
          set -euo pipefail
          node research/CRYPT_VP/phase_check.mjs | tee "$RUNNER_TEMP/qobs-02.json"
          python3 - "$RUNNER_TEMP/qobs-02.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="qobs-02-v1"
          assert r["cases"]==r["comparisonChecks"]==len(r["rows"])==72
          assert r["spectralChecks"]==144
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qobs-02-exact
          path: ${{ runner.temp }}/qobs-02.json

  exact-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay QBTC-01 finite games
        shell: bash
        run: |
          set -euo pipefail
          node research/CRYPT_VP/qbtc01_check.mjs | tee "$RUNNER_TEMP/qbtc-01.json"
          python3 - "$RUNNER_TEMP/qbtc-01.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="qbtc-01-v1"
          assert len(r["checks"])==len(set(r["checks"]))==19
          assert r["prefix"]=={"singletonCases":256,"multivaluedCases":32,"queriesPerSatisfiable8bitInstance":9,"forgedFreshMessage":True}
          d={(x["n"],x["family"]):x for x in r["discrimination"]}
          assert len(d)==4
          for n,z in ((2,[1,3]),(3,[3,7])):
              for family,pair in (("full-orthogonal",[1,1]),("common-row-orthogonal",z)):
                  x=d[n,family]
                  assert x["hiddenSingleTV"]==[0,1] and x["referencePairTV"]==pair
                  assert x["perfectLabelRecovery"] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbtc-01-exact
          path: ${{ runner.temp }}/qbtc-01.json

  exact-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay QBTC-02 finite covering and consensus games
        shell: bash
        run: |
          set -euo pipefail
          node research/CRYPT_VP/qbtc02_check.mjs | tee "$RUNNER_TEMP/qbtc-02.json"
          python3 - "$RUNNER_TEMP/qbtc-02.json" <<'PY'
          import json,sys
          from fractions import Fraction
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="qbtc-02-v1"
          assert r["cover"]=={"sets":256,"shiftPairChecks":16384,"low":37,"high":37,"gap":182,"gapYes":126}
          rows=r["consensus"]["rows"]
          assert r["consensus"]["cases"]==len(rows)==126
          assert len({(tuple(x["p"]),x["repetitions"],x["nodes"]) for x in rows})==126
          for x in rows:
              p=Fraction(*map(int,x["p"]))
              a=Fraction(*map(int,x["accept"]))
              s=Fraction(*map(int,x["split"]))
              n=x["nodes"]
              assert s==1-a**n-(1-a)**n
              if p==Fraction(1,2):
                  assert a==p and s==1-Fraction(2,2**n)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbtc-02-exact
          path: ${{ runner.temp }}/qbtc-02.json

  exact-kqt-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay QBTC-03 one-time controls and exact reliability budgets
        shell: bash
        run: |
          set -euo pipefail
          node research/CRYPT_VP/qbtc03_check.mjs | tee "$RUNNER_TEMP/qbtc-03.json"
          python3 - "$RUNNER_TEMP/qbtc-03.json" <<'PY'
          import json,sys,math
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="qbtc-03-v1"
          assert r["fixture"]=={"honest":16,"substitutions":240,"mutations":448,"malformed":64,"reuse":240,"hybrids":800}
          assert r["budgetCases"]==len(r["budgets"])==18
          assert len({(x["width"],x["validators"],x["checks"],x["b"]) for x in r["budgets"]})==18
          def tail(t):
              return sum(math.comb(t,j)*2**j for j in range((t+1)//2)),3**t
          for x in r["budgets"]:
              t=x["repetitions"]
              assert t>0 and t%2==1 and x["evalCalls"]==x["width"]*t
              factor=x["width"]*x["validators"]*x["checks"]*2**x["b"]
              u,v=tail(t)
              assert (u,v)==(int(x["tailNum"]),int(x["tailDen"]))
              assert u*factor<=v
              if t>1:
                  u,v=tail(t-2)
                  assert u*factor>v
          assert len(r["sizes"])==6
          for x in r["sizes"]:
              n,L=x["n"],x["messageBits"]
              assert 8*x["pkBytes"]==3*n+12*L*n
              assert 8*x["signatureBytes"]==L*n
              assert 8*x["secretBytes"]==2*L*n
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbtc-03-exact
          path: ${{ runner.temp }}/qbtc-03.json

  exact-collision-plant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay QBTC-04 collision census and raw references
        shell: bash
        run: |
          set -euo pipefail
          node research/CRYPT_VP/qbtc04_check.mjs | tee "$RUNNER_TEMP/qbtc-04.json"
          python3 - "$RUNNER_TEMP/qbtc-04.json" <<'PY'
          import json,sys,math
          from fractions import Fraction as F
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="qbtc-04-v1"
          assert r["tables"]==77595==sum(c["tables"] for c in r["cases"])
          assert {(c["N"],c["M"]) for c in r["cases"]}=={(n,m) for n in (4,6,8) for m in (2,3,4)}
          assert len(r["cases"])==9 and len(set(r["ledger"]))==5
          for c in r["cases"]:
              n,m=c["N"],c["M"]
              k=math.comb(n,2)
              t=m**n
              h=list(map(int,c["hist"]))
              assert len(h)==k+1 and sum(h)==t==c["tables"]
              mu=F(k,m)
              var=F(k*(m-1),m*m)
              assert F(sum(i*z for i,z in enumerate(h)),t)==mu
              assert sum(F(z,t)*(i-mu)**2 for i,z in enumerate(h))==var
              v=F(sum(abs(m*i-k)*z for i,z in enumerate(h)),2*t*k)
              assert v==F(*map(int,c["tv"])) and v*v<=F(m-1,4*k)
              assert F(*map(int,c["recoverPlant"]))==F(t-h[0],t)/mu
              assert F(*map(int,c["destroyChosen"]))==F(2*(m-1),n*m)
              assert F(*map(int,c["realCollisionSuccess"]))==F(t-h[0],t)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbtc-04-exact
          path: ${{ runner.temp }}/qbtc-04.json

  exact-correlated-resampling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay QBTC-05 empirical multirow replacement
        shell: bash
        run: |
          set -euo pipefail
          node research/CRYPT_VP/qbtc05_check.mjs | tee "$RUNNER_TEMP/qbtc-05.json"
          python3 - "$RUNNER_TEMP/qbtc-05.json" <<'PY'
          import json,sys,math
          from fractions import Fraction as F
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="qbtc-05-v1"
          assert r["contexts"]==18304 and r["conditionalOutcomes"]==216832 and r["checks"]==72
          cases={(c["N"],c["k"]):c for c in r["cases"]}
          assert len(r["cases"])==6 and set(cases)=={(n,k) for n in (3,4,5) for k in (1,2)}
          def frac(x): return F(*map(int,x))
          for (n,k),c in cases.items():
              assert c["contexts"]==4**n*math.comb(n,k)
              assert c["outcomes"]==c["contexts"]*4**k
              assert {frac(x["delta"]) for x in c["thresholds"]}=={F(1,4),F(1,2),F(1)}
              assert len(c["costs"])==4 and len(c["thresholds"])==3
              m=n-k
              for x in c["thresholds"]:
                  d=frac(x["delta"])
                  bad=F(sum(math.comb(m,j) for j in range(m+1) if 2*max(j,m-j)>(1+d)*m),2**m)
                  assert frac(x["bad"])==bad
                  for y in c["costs"]:
                      a,b=frac(y["ind"]),frac(y["copy"])
                      B=F((3*n*(n+1)//2)**2 if y["name"]=="weighted-euclidean" else 1)
                      assert 0<=a<=B and 0<=b<=B
                      assert b<=(1+d)**k*a+B*bad
              if k==2:
                  old={y["name"]:frac(y["ind"]) for y in cases[n,1]["costs"]}
                  for y in c["costs"]: assert frac(y["ind"])<=2*old[y["name"]]
          assert {x["name"]:frac(x["maxRatio"]) for x in r["negative"]}=={"adaptive-source":F(2),"shared-source-k2":F(2),"physical-copy":F(8)}
          for x in r["negative"]: assert frac(x["correlated"])/frac(x["ind"])==frac(x["maxRatio"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbtc-05-exact
          path: ${{ runner.temp }}/qbtc-05.json
