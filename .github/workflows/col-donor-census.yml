name: COL-06 donor availability
on:
  pull_request:
    paths: ['research/collatz_resonance/**', 'tests/test_collatz_donor_census.py', '.github/workflows/col-donor-census.yml']
  push:
    paths: ['research/collatz_resonance/**', 'tests/test_collatz_donor_census.py', '.github/workflows/col-donor-census.yml']
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_collatz_donor_census.py -v
      - run: python -m research.collatz_resonance.donor_census --check research/collatz_resonance/data/donor_census_summary.json
