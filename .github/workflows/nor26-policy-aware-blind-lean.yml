name: NOR-26 policy-aware finite blind-attack mixture theorem

on:
  push:
    paths:
      - 'MathCan/NOR26PolicyAwareBlindAudit.lean'
      - 'MathCan.lean'
      - 'research/nor26/**'
      - '.github/workflows/nor26-policy-aware-blind-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR26PolicyAwareBlindAudit.lean'
      - 'MathCan.lean'
      - 'research/nor26/**'
      - '.github/workflows/nor26-policy-aware-blind-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional-mixture-bound-lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify fixed-radius nohit mixture inequality and inspect axioms
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR26PolicyAwareBlindAudit.lean | tee nor26-policy-aware-blind-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor26-policy-aware-blind-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor26-blind-policy-mixture-kernel-axioms
          path: nor26-policy-aware-blind-axioms.txt
