name: DEL-19 affine Bertini parameter fiber

on:
  push:
    branches: [proof/deligne19-affine-bertini-fiber-rank-20261122]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/AffineBertiniFiber.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'research/deligne_sign_audit/DEL19_*'
      - 'research/deligne_sign_audit/del19_*'
      - 'tests/test_deligne19_bertini_fiber.py'
      - '.github/workflows/deligne19-bertini-fiber.yml'
  workflow_dispatch:

concurrency:
  group: deligne19-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check cotangent surjectivity and incidence fiber
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/AffineBertiniFiber.lean | tee deligne19-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne19-axioms.txt; then
            echo 'DEL-19 admitted proof or unexpected reduction axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 96 exact augmented fiber cases
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_deligne19_bertini_fiber
