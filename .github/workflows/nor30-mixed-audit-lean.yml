name: NOR-30 minimax mixture floor and finite cross-play witness kernel

on:
  push:
    paths:
      - 'MathCan/NOR30MixedAudit.lean'
      - 'MathCan.lean'
      - 'research/nor30/**'
      - '.github/workflows/nor30-mixed-audit-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR30MixedAudit.lean'
      - 'MathCan.lean'
      - 'research/nor30/**'
      - '.github/workflows/nor30-mixed-audit-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mixed-auditor-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify inherited mixture bound and finite minimax witness in Lean 4.35
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR30MixedAudit.lean | tee nor30-mixed-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor30-mixed-axioms.txt; then
            echo 'NOR30 admitted proof or missing goal'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor30-finite-mixed-audit-axiom-inventory
          path: nor30-mixed-axioms.txt
