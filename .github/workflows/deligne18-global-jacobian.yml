name: DEL-18 global U2 Jacobian unit ideal

on:
  push:
    branches: [proof/deligne18-global-bad-ideal-20261122]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/ParabolaGlobalJacobian.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'research/deligne_sign_audit/DEL18_*'
      - 'tests/test_deligne18_global_jacobian.py'
      - '.github/workflows/deligne18-global-jacobian.yml'
  workflow_dispatch:

concurrency:
  group: deligne18-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check actual global ideal and parameter selection
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/ParabolaGlobalJacobian.lean | tee deligne18-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne18-axioms.txt; then
            echo 'DEL-18 admitted proof or unexpected axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify DEL-18 exact Jacobian and parameter selection
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_deligne18_global_jacobian
