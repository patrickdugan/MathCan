name: DEL-21F actual Kaehler point-fiber

on:
  push:
    branches: [proof/deligne21f-kahler-fiber-20261122]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/ActualKahlerFiber.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - '.github/workflows/deligne21f-kahler-fiber.yml'
  workflow_dispatch:

concurrency:
  group: deligne21f-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check actual Kaehler fiber
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/ActualKahlerFiber.lean | tee deligne21f-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne21f-axioms.txt; then
            echo 'DEL-21F admitted proof or unexpected axiom'
            exit 1
          fi
