name: SWC-01 graph witness Lean kernel audit
permissions:
  contents: read
on:
  push:
    paths:
      - 'MathCan/GraphWitness.lean'
      - '.github/workflows/swc01-graph-witness.yml'
  pull_request:
    paths:
      - 'MathCan/GraphWitness.lean'
      - '.github/workflows/swc01-graph-witness.yml'
  workflow_dispatch:
jobs:
  finite-symmetry-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-verify finite graph counts and F3 pinned witness arithmetic
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/GraphWitness.lean | tee swc01-axioms.txt
          lake env lean MathCan/GraphWitnessF3.lean | tee -a swc01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' swc01-axioms.txt; then
            echo 'Admitted or native reduction axiom detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: swc01-lean-axioms
          path: swc01-axioms.txt
