name: VPVNP-02E ordered frame fibers
# Historical per-stage gate; consolidated proof workflow runs on the PR.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: vpvnp02e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check ordered frame fiber equivalences
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP/{RankSpectral,BinaryWalsh,HyperplaneCancellation,OrderedFrameFibers}.lean .
          lake env bash -c 'set -euo pipefail; export LEAN_PATH="$PWD:$LEAN_PATH"; for m in RankSpectral BinaryWalsh HyperplaneCancellation; do lean -o "$m.olean" "$m.lean"; done; lean OrderedFrameFibers.lean' | tee "$RUNNER_TEMP/vpvnp02e-axioms.txt"
          python3 - "$RUNNER_TEMP/vpvnp02e-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set("normal_represents normal_unique frame_normal_equation frame_normal_nonzero frame_normal_unique kernel_finrank prefixEquiv extendFrame frameFiberEquiv commonFiber uniform_fiber_card frame_fiber_nonempty".split())
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'VPVNP\.Binary\.([\w]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'VPVNP\.Binary\.([\w]+)' does not depend on any axioms",s):
              found.add(name)
          assert expected <= found,(found,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpvnp02e-native-axioms
          path: ${{ runner.temp }}/vpvnp02e-axioms.txt
  exact-frame-fibers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all frames through dimension four
        shell: bash
        run: |
          set -euo pipefail
          python3 research/VPVNP/frame_fiber_check.py | tee "$RUNNER_TEMP/vpvnp02e-frames.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vpvnp02e-exact-frames
          path: ${{ runner.temp }}/vpvnp02e-frames.json
