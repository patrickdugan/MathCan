name: NOR-17 kernel soundness of prefix-screened budgeted public certificates

on:
  push:
    paths:
      - 'MathCan/NOR17BudgetedPublicCertificate.lean'
      - 'MathCan.lean'
      - 'research/nor17/**'
      - '.github/workflows/nor17-budgeted-public-certificate.yml'
  pull_request:
    paths:
      - 'MathCan/NOR17BudgetedPublicCertificate.lean'
      - 'MathCan.lean'
      - 'research/nor17/**'
      - '.github/workflows/nor17-budgeted-public-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-prefix-selective-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify generic prefix-filter and budget certificate theorem axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR17BudgetedPublicCertificate.lean | tee nor17-public-certificate-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor17-public-certificate-axioms.txt; then
            echo 'Unexpected admitted proof, native reduction marker or compilation error'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor17-prefix-budgeted-certificate-lean-axioms
          path: nor17-public-certificate-axioms.txt
