name: AHR-07 four-phase numerical oracle

on:
  pull_request:
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr07/**'
      - '.github/workflows/ahr07-four-phase.yml'
  push:
    branches: [main]
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr07/**'
      - '.github/workflows/ahr07-four-phase.yml'

permissions:
  contents: read

jobs:
  four-phase-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run AHR-07 finite Hamiltonian and shot-noise checks
        run: python research/arithmetic_holonomy_rotor/ahr07/ahr07_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: ahr07-finite-dimensional-validation
          path: research/arithmetic_holonomy_rotor/ahr07/ahr07_ci_validation.json
          retention-days: 30
