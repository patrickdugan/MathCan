name: DETFACT-18 segmented enumeration and saturation roster
on:
  push:
    paths: ['MathCan/DETFACT18Enumeration.lean','research/cogentic_deterministic_factoring/enumeration_audit.mjs','.github/workflows/detfact18-enumeration-lean.yml']
  pull_request:
    paths: ['MathCan/DETFACT18Enumeration.lean','research/cogentic_deterministic_factoring/enumeration_audit.mjs','.github/workflows/detfact18-enumeration-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check dependency modules and enumeration proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/MathCan
          for module in DETFACT15Stream DETFACT16Saturation DETFACT17OddSplit; do
            lake env lean -o ".lake/build/lib/lean/MathCan/$module.olean" "MathCan/$module.lean"
          done | tee detfact18-axioms.txt
          lake env lean MathCan/DETFACT18Enumeration.lean | tee -a detfact18-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|declaration uses .sorry.' detfact18-axioms.txt; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay finite segmented marking and LCM equivalence
        run: node research/cogentic_deterministic_factoring/enumeration_audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: detfact18-axioms
          path: detfact18-axioms.txt
