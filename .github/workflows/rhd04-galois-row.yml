name: RHD-04 Galois row and theta lift source audit

on:
  push:
    paths:
      - 'MathCan/RHGaloisRowInputs.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/galois_row_input_audit.py'
      - 'tests/test_rhd04_galois_sources.py'
      - 'research/rh_proof_distillation/GALOIS_ROW_INPUTS.md'
      - '.github/workflows/rhd04-galois-row.yml'
  pull_request:
    paths:
      - 'MathCan/RHGaloisRowInputs.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/galois_row_input_audit.py'
      - 'tests/test_rhd04_galois_sources.py'
      - 'research/rh_proof_distillation/GALOIS_ROW_INPUTS.md'
      - '.github/workflows/rhd04-galois-row.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-galois:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: mathcan
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: f150e02623b1e2bbe1f1da8eab5ffee5e930a6a3
          path: upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/ThetaParseval/HalfIndexLattices/TLiftK.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/ThetaParseval/ThetaKernels/GalTPDefs.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/ThetaParseval/ThetaKernels/TPGHolds.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/ThetaParseval/ThetaKernels/TLiftK.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/GeometricFlagBases/GeoOneOfParts.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/GeometricFlagBases/GeometricRealizationOfWeightOne.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/GeometricFlagBases/WeightOneGeometricRealization.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/Development.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/GaloisRepresentationsOfThetaLift.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/RowSrc.lean
            src/Development/AutomorphicArithmetic/Foundations/LocalLanglands/LocalCentralUnits/RecTExists.lean
            src/Development/AutomorphicArithmetic/CharacterBoxes/MainConclusion.lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure-Python source gate and statement mutation tests
        working-directory: mathcan
        run: python -m unittest tests.test_rhd04_galois_sources -v
      - name: Audit original Galois and theta lift source interfaces
        working-directory: mathcan
        run: |
          mkdir -p rhd04
          python -m research.rh_proof_distillation.galois_row_input_audit \
            --upstream ../upstream \
            --output rhd04/source-galois-row-graph.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd04-source-theta-galois-graph
          path: mathcan/rhd04/
          if-no-files-found: ignore

  independent-lean-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check source-interface implications and axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHGaloisRowInputs.lean | tee rhd04-lean-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd04-lean-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd04-theta-galois-lean-axioms
          path: rhd04-lean-axioms.txt
          if-no-files-found: ignore
