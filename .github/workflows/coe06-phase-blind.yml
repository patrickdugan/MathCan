name: COE-06 phase-blind observer Lean and resource certificates

on:
  pull_request:
    paths:
      - 'MathCan/PhaseBlindObservers.lean'
      - 'MathCan.lean'
      - 'research/compactification/PHASE_BLIND_OBSERVER_CAPACITY.md'
      - '.github/workflows/coe06-phase-blind.yml'
  push:
    branches: [main]
    paths:
      - 'MathCan/PhaseBlindObservers.lean'
      - 'MathCan.lean'
      - '.github/workflows/coe06-phase-blind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check explicit cyclic code and exact arithmetic assumptions
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PhaseBlindObservers.lean | tee coe06-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' coe06-axioms.txt; then
            echo 'Unexpected native-reduction axiom or admission'
            exit 1
          fi
