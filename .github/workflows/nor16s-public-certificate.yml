name: NOR-16S complete public-output certificate and ambiguity kernel proof

on:
  push:
    paths:
      - 'MathCan/NOR16PublicOutputCertificate.lean'
      - 'MathCan.lean'
      - 'research/nor16s/**'
      - '.github/workflows/nor16s-public-certificate.yml'
  pull_request:
    paths:
      - 'MathCan/NOR16PublicOutputCertificate.lean'
      - 'MathCan.lean'
      - 'research/nor16s/**'
      - '.github/workflows/nor16s-public-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-error-public-certificate-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit exact accepted-family conditional soundness without admitted axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR16PublicOutputCertificate.lean | tee nor16s-public-certificate-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor16s-public-certificate-axioms.txt; then
            echo 'Unexpected admitted or native reduction marker'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor16s-public-certificate-lean-axioms
          path: nor16s-public-certificate-axioms.txt
