name: Hadwiger trajectory certificates
on:
  pull_request:
    paths:
      - 'MathCan/HadwigerTrajectory.lean'
      - 'research/hadwiger_trajectory/**'
      - '.github/workflows/hadwiger-trajectory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinate-kernel-and-finite-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check integer coordinate theorems and axioms
        run: |
          set -euo pipefail
          source_file="$(mktemp --suffix=.lean)"
          cp MathCan/HadwigerTrajectory.lean "$source_file"
          printf '\n#print axioms MathCan.HadwigerTrajectory.prefix_identity\n#print axioms MathCan.HadwigerTrajectory.padded_identity\n#print axioms MathCan.HadwigerTrajectory.lifting_coordinate\n' >> "$source_file"
          lake env lean "$source_file" 2>&1 | tee hadwiger-kernel.log
          if grep -Eq 'sorryAx|ofReduceBool' hadwiger-kernel.log; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay exact finite witnesses and negative controls
        run: node research/hadwiger_trajectory/verify.mjs
