name: RHD-15 split unitary torus finite character gym

on:
  push:
    paths:
      - 'MathCan/RHSplitTorusCharacter.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/rhd15_split_torus_character.py'
      - 'research/rh_proof_distillation/RHD15_SPLIT_TORUS_CHARACTER.md'
      - 'tests/test_rhd15_split_torus_character.py'
      - '.github/workflows/rhd15-split-torus.yml'
  pull_request:
    paths:
      - 'MathCan/RHSplitTorusCharacter.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/rhd15_split_torus_character.py'
      - 'research/rh_proof_distillation/RHD15_SPLIT_TORUS_CHARACTER.md'
      - 'tests/test_rhd15_split_torus_character.py'
      - '.github/workflows/rhd15-split-torus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-split-place-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustively check two-field norm-one first layers and repair trajectories
        run: python -m unittest tests.test_rhd14_norm_one_collapse tests.test_rhd15_split_torus_character -v
      - name: Produce split torus character JSONL, SHA-256 and manifest
        run: |
          mkdir -p rhd15
          python -m research.rh_proof_distillation.rhd15_split_torus_character --output rhd15/split_torus.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd15-torus-repair-receipts
          path: rhd15/
          if-no-files-found: ignore

  finite-torus-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify anti-diagonal characters, surjectivity and Apart-label arithmetic
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHSplitTorusCharacter.lean | tee rhd15-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd15-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd15-lean-axioms
          path: rhd15-axioms.txt
          if-no-files-found: ignore
