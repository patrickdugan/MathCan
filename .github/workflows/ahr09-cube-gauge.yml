name: AHR-09 cube gauge reconstruction oracle

on:
  pull_request:
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr09/**'
      - '.github/workflows/ahr09-cube-gauge.yml'
  push:
    branches: [main]
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr09/**'
      - '.github/workflows/ahr09-cube-gauge.yml'

permissions:
  contents: read

jobs:
  cube-gauge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned integer and numerical algebra dependencies
        run: python -m pip install numpy==2.3.5 sympy==1.14.0
      - name: Verify cochain exactness and Bianchi denoising
        run: python research/arithmetic_holonomy_rotor/ahr09/ahr09_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: ahr09-cube-gauge-validation
          path: research/arithmetic_holonomy_rotor/ahr09/ahr09_ci_validation.json
          retention-days: 30
