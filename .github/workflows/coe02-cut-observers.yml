name: COE-02 cut observer Lean and exact checks

on:
  pull_request:
    paths:
      - 'MathCan/ChromaticCutCodes.lean'
      - 'MathCan.lean'
      - 'research/compactification/CHROMATIC_CUT_CAPACITY.md'
      - '.github/workflows/coe02-cut-observers.yml'
  push:
    branches: [main]
    paths:
      - 'MathCan/ChromaticCutCodes.lean'
      - 'MathCan.lean'
      - '.github/workflows/coe02-cut-observers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut-certificate-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check finite cut certificates and transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/ChromaticCutCodes.lean | tee coe02-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' coe02-axioms.txt; then
            echo 'Rejected: sorry or native reduction axiom in Lean proof.'
            exit 1
          fi
