name: VPVNP BGS Boolean oracle barrier
on:
  pull_request:
    paths:
      - 'research/VPVNP_BGS/**'
      - '.github/workflows/vpvnp-bgs01.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpvnp-bgs01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact finite regressions
        shell: bash
        run: |
          set -euo pipefail
          node research/VPVNP_BGS/bgs01.mjs | tee "$RUNNER_TEMP/bgs01.json"
          python3 - "$RUNNER_TEMP/bgs01.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="vpvnp-bgs01"
          assert r["fields"]==[2,3,5,7,11]
          assert r["checks"]=={"rank_triples":30,"boolean_or_bound":640,"mobius_entries":27300,"count_cancellations":11,"zero_path_transcripts":6058,"complete_or_tables":276}
          assert len(r["rank_rows"])==30
          for q in r["rank_rows"]:
              n=q["n"]
              assert (q["disjoint"],q["nondisjoint"],q["count"])==(2**n,2**n-1,n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bgs01-exact
          path: ${{ runner.temp }}/bgs01.json
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Pinned Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Native proofs and axiom audit
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP_BGS/BooleanOracle.lean .
          lake env lean BooleanOracle.lean 2>&1 | tee "$RUNNER_TEMP/bgs01-axioms.txt"
          python3 - "$RUNNER_TEMP/bgs01-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set(re.findall(r"^#print axioms ([\w.]+)",Path("BooleanOracle.lean").read_text(),re.M))
          assert len(expected)==12
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|error[:(]",s)
          found=set()
          for name,body in re.findall(r"'([\w.]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(",") if x.strip()) <= {"propext","Classical.choice","Quot.sound"},(name,body)
          found.update(re.findall(r"'([\w.]+)' does not depend on any axioms",s))
          assert found==expected,(expected-found,found-expected)
          print("PASS",len(found),"native axiom receipts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgs01-native
          path: ${{ runner.temp }}/bgs01-axioms.txt
