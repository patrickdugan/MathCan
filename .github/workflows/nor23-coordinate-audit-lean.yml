name: NOR-23 kernel coordinate audit, finite sample counts and adaptive evasion

on:
  push:
    paths:
      - 'MathCan/NOR23CoordinateAudit.lean'
      - 'MathCan.lean'
      - 'research/nor23/**'
      - '.github/workflows/nor23-coordinate-audit-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR23CoordinateAudit.lean'
      - 'MathCan.lean'
      - 'research/nor23/**'
      - '.github/workflows/nor23-coordinate-audit-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-coordinate-audit-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel check audit mismatch, full equality, adaptive evasion, finite counts and axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR23CoordinateAudit.lean | tee nor23-coordinate-audit-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor23-coordinate-audit-axioms.txt; then
            echo 'NOR23 unexpected admitted proof, compilation error or reduction marker'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor23-exact-coordinate-audit-lean-axiom-inventory
          path: nor23-coordinate-audit-axioms.txt
