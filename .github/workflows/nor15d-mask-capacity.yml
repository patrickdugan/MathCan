name: NOR-15D exact public mask partition capacity Lean proof

on:
  push:
    paths:
      - 'MathCan/NOR15MaskCapacity.lean'
      - 'MathCan.lean'
      - 'research/nor15d/**'
      - '.github/workflows/nor15d-mask-capacity.yml'
  pull_request:
    paths:
      - 'MathCan/NOR15MaskCapacity.lean'
      - 'MathCan.lean'
      - 'research/nor15d/**'
      - '.github/workflows/nor15d-mask-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-signature-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify generic finite-capacity theorem and pinned 14-class arithmetic
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR15MaskCapacity.lean | tee nor15d-mask-capacity-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor15d-mask-capacity-axioms.txt; then
            echo 'Admitted proof or nonkernel reduction marker'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor15d-mask-capacity-lean-axioms
          path: nor15d-mask-capacity-axioms.txt
