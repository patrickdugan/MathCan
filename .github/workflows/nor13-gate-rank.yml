name: NOR-13R exact recurrent gate endpoint ranking theorem

on:
  push:
    paths:
      - 'MathCan/NOR13GateOrder.lean'
      - 'MathCan.lean'
      - 'research/nor13/**'
      - '.github/workflows/nor13-gate-rank.yml'
  pull_request:
    paths:
      - 'MathCan/NOR13GateOrder.lean'
      - 'MathCan.lean'
      - 'research/nor13/**'
      - '.github/workflows/nor13-gate-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-order-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit exact rational-gate endpoint ordering kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR13GateOrder.lean | tee nor13-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' nor13-axioms.txt; then
            echo 'Admitted or native reduction axiom'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor13-gate-endpoint-order-lean-axioms
          path: nor13-axioms.txt
