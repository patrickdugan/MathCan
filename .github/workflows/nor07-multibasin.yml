name: NOR-07 disjoint-basin metric and code-collapse Lean gate

on:
  pull_request:
    paths:
      - 'MathCan/MultiBasin.lean'
      - 'MathCan.lean'
      - 'research/nor07/**'
      - '.github/workflows/nor07-multibasin.yml'
  push:
    paths:
      - 'MathCan/MultiBasin.lean'
      - 'MathCan.lean'
      - 'research/nor07/**'
      - '.github/workflows/nor07-multibasin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-metric-lemmas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit NOR-07 disjoint-basin and code-collapse lemmas
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/MultiBasin.lean | tee nor07-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' nor07-axioms.txt; then
            echo 'Admitted proof or native reduction axiom'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor07-lean-axiom-audit
          path: nor07-axioms.txt
