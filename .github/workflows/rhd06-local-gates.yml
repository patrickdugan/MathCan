name: RHD-06 local place and theta-weight gates

on:
  push:
    paths:
      - 'MathCan/RHLocalPlaceGates.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/geo_theta_local_gates_audit.py'
      - 'research/rh_proof_distillation/LOCAL_PLACE_GATES.md'
      - 'tests/test_rhd06_local_gates.py'
      - '.github/workflows/rhd06-local-gates.yml'
  pull_request:
    paths:
      - 'MathCan/RHLocalPlaceGates.lean'
      - 'MathCan.lean'
      - 'research/rh_proof_distillation/geo_theta_local_gates_audit.py'
      - 'research/rh_proof_distillation/LOCAL_PLACE_GATES.md'
      - 'tests/test_rhd06_local_gates.py'
      - '.github/workflows/rhd06-local-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-mutation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: mathcan
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: f150e02623b1e2bbe1f1da8eab5ffee5e930a6a3
          path: upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Development/AbelianVarietyTheory/Statements/EllipticCurveLevels/ClosedAtLConclusionOfMem.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/GeometricFlagBases/HodgeTrAt.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/ZetaCharacterDivisibility/StConj.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/ZetaCharacterDivisibility/SeedFinOddOf.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/IntegralStructures/ZetaCharacterDivisibility/PSameOr.lean
            src/Development/AutomorphicArithmetic/Foundations/GaloisRepresentations/ThetaParseval/ThetaKernels/GalTPDefs.lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source mutation controls and congruence roots
        working-directory: mathcan
        run: python -m unittest tests.test_rhd06_local_gates -v
      - name: Audit pinned source definitions and emit receipt
        working-directory: mathcan
        run: |
          mkdir -p rhd06
          python -m research.rh_proof_distillation.geo_theta_local_gates_audit \
            --upstream ../upstream --output rhd06/places_and_weights.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd06-source-and-residue-gate
          path: mathcan/rhd06/
          if-no-files-found: ignore

  independent-lean-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check Lean kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHLocalPlaceGates.lean | tee rhd06-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd06-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd06-lean-axioms
          path: rhd06-axioms.txt
          if-no-files-found: ignore
