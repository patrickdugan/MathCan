name: NOR-40 fourth-singleton global CAL lower bound Lean kernel

on:
  push:
    branches:
      - research/nor40-fourth-singleton-bound-20261117
    paths:
      - 'MathCan/NOR40SingletonBracket.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor40-fourth-singleton-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR40SingletonBracket.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor40-fourth-singleton-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-four-support-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check fourth-singleton bound and axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR40SingletonBracket.lean | tee nor40-fourth-bound-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor40-fourth-bound-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor40-fourth-singleton-lean-axioms
          path: nor40-fourth-bound-axioms.txt
