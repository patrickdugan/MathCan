name: DETFACT-17 certified odd stream and split probes
on:
  push:
    paths: ['MathCan/DETFACT15Stream.lean','MathCan/DETFACT16Saturation.lean','MathCan/DETFACT17OddSplit.lean','research/cogentic_deterministic_factoring/odd_split_audit.mjs','.github/workflows/detfact17-odd-split-lean.yml']
  pull_request:
    paths: ['MathCan/DETFACT15Stream.lean','MathCan/DETFACT16Saturation.lean','MathCan/DETFACT17OddSplit.lean','research/cogentic_deterministic_factoring/odd_split_audit.mjs','.github/workflows/detfact17-odd-split-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Compile the two verified dependency modules and check composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/MathCan
          lake env lean -o .lake/build/lib/lean/MathCan/DETFACT15Stream.olean MathCan/DETFACT15Stream.lean | tee detfact17-axioms.txt
          lake env lean -o .lake/build/lib/lean/MathCan/DETFACT16Saturation.olean MathCan/DETFACT16Saturation.lean | tee -a detfact17-axioms.txt
          lake env lean MathCan/DETFACT17OddSplit.lean | tee -a detfact17-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|declaration uses .sorry.' detfact17-axioms.txt; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay odd exponent and split probes
        run: node research/cogentic_deterministic_factoring/odd_split_audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: detfact17-axioms
          path: detfact17-axioms.txt
