name: NOR-22 trusted future modular commitments and collision impossibility

on:
  push:
    paths:
      - 'MathCan/NOR22ModularFutureCommitments.lean'
      - 'MathCan.lean'
      - 'research/nor22/**'
      - '.github/workflows/nor22-modular-commitment.yml'
  pull_request:
    paths:
      - 'MathCan/NOR22ModularFutureCommitments.lean'
      - 'MathCan.lean'
      - 'research/nor22/**'
      - '.github/workflows/nor22-modular-commitment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-modular-collision-and-target-commitment-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check authentic target mismatch, forged-vacuity, product collision and axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR22ModularFutureCommitments.lean | tee nor22-modular-commitment-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor22-modular-commitment-axioms.txt; then
            echo 'NOR22 unexpected admitted proof, compilation error or reduction marker'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor22-modular-target-commitment-lean-axioms
          path: nor22-modular-commitment-axioms.txt
