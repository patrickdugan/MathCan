name: DEL-22D arbitrary rank-d conormal pivot chart

on:
  push:
    branches: [proof/deligne22d-rankd-pivot-20261123]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/RankDPivotInterpolation.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'tests/test_deligne22c_rankd_pivot.py'
      - 'research/deligne_sign_audit/DEL22D_*'
      - '.github/workflows/deligne22d-rankd-pivot.yml'
  workflow_dispatch:

concurrency:
  group: deligne22d-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check general pivot and Deligne04 umbrella
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/RankDPivotInterpolation.lean | tee deligne22d-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne22d-axioms.txt; then
            echo 'DEL-22D unexpected axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay GF(4)/GF(9) pivot and original scheme oracles
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_deligne22c_rankd_pivot tests.test_deligne22b_universal_section tests.test_deligne22a_relative_critical
