name: NCG-01 trace bound and operator audit

on:
  push:
    paths:
      - 'MathCan/NullConeTraceBound.lean'
      - 'research/null_cone_audit/**'
      - '.github/workflows/ncg01-null-cone-audit.yml'
  pull_request:
    paths:
      - 'MathCan/NullConeTraceBound.lean'
      - 'research/null_cone_audit/**'
      - '.github/workflows/ncg01-null-cone-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact operator countermodels
        run: |
          python research/null_cone_audit/operator_countermodels.py --check research/null_cone_audit/operator_countermodels.json
          cp research/null_cone_audit/operator_countermodels.json "${{ runner.temp }}/operator-countermodels.json"
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check the scaled finite-sum theorem and its axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NullConeTraceBound.lean | tee "${{ runner.temp }}/null-cone-axioms.txt"
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' "${{ runner.temp }}/null-cone-axioms.txt"; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ncg01-operator-audit
          path: |
            ${{ runner.temp }}/operator-countermodels.json
            ${{ runner.temp }}/null-cone-axioms.txt
