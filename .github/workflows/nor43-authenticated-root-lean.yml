name: NOR-43 authenticated pinned-root conditional soundness Lean kernel

on:
  push:
    branches:
      - research/nor43-pinned-root-soundness-20261118
    paths:
      - 'MathCan/NOR43AuthenticatedRoot.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor43-authenticated-root-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR43AuthenticatedRoot.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor43-authenticated-root-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional_root_and_opening_soundness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Lean kernel and no-sorry theorem axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR43AuthenticatedRoot.lean | tee nor43-authenticated-root-axioms.txt
          if grep -Eq 'sorryAx|^error:|admit' nor43-authenticated-root-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor43-conditional-root-lean-axioms
          path: nor43-authenticated-root-axioms.txt
