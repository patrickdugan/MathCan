name: OVC-01 ordered jet kernel checks
permissions:
  contents: read
on:
  push:
    paths:
      - 'MathCan/OrderedJet.lean'
      - '.github/workflows/ovc01-ordered-jet.yml'
  pull_request:
    paths:
      - 'MathCan/OrderedJet.lean'
      - '.github/workflows/ovc01-ordered-jet.yml'
  workflow_dispatch:
jobs:
  ordered-jet-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check standalone ordered-jet proofs with pinned Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/OrderedJet.lean | tee ovc01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' ovc01-axioms.txt; then
            echo 'Admitted proof or native reduction axiom detected.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ovc01-lean-axioms
          path: ovc01-axioms.txt
