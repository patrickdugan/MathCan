name: NRF-02 graph switching and cross-multiplied Lean proof

on:
  push:
    paths:
      - 'MathCan/GraphSwitching.lean'
      - 'MathCan.lean'
      - 'research/compactification/graph_switching.py'
      - 'tests/test_graph_switching.py'
      - 'research/compactification/barycentric_fixedpoints.py'
      - 'tests/test_barycentric_fixedpoints.py'
      - 'MathCan/ObservableQuotient.lean'
      - 'tests/test_observable_fibers.py'
      - '.github/workflows/nrf02-graph-switching.yml'
  pull_request:
    paths:
      - 'MathCan/GraphSwitching.lean'
      - 'MathCan.lean'
      - 'research/compactification/graph_switching.py'
      - 'tests/test_graph_switching.py'
      - 'research/compactification/barycentric_fixedpoints.py'
      - 'tests/test_barycentric_fixedpoints.py'
      - 'MathCan/ObservableQuotient.lean'
      - 'tests/test_observable_fibers.py'
      - '.github/workflows/nrf02-graph-switching.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_crouzeix_switching tests.test_graph_switching tests.test_barycentric_fixedpoints tests.test_observable_fibers -v

  lean-cross-multiplied-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Print theorem axioms and reject admitted proofs
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/GraphSwitching.lean | tee nrf02-axioms.txt
          lake env lean MathCan/ObservableQuotient.lean | tee -a nrf02-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' nrf02-axioms.txt; then
            echo 'An admitted or native reduction axiom was detected.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nrf02-lean-axiom-audit
          path: nrf02-axioms.txt
