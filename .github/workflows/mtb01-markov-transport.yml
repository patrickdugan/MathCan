name: MTB-01 Markov transport Lean proof
permissions:
  contents: read
on:
  push:
    paths:
      - 'MathCan/MarkovTransport.lean'
      - '.github/workflows/mtb01-markov-transport.yml'
  pull_request:
    paths:
      - 'MathCan/MarkovTransport.lean'
      - '.github/workflows/mtb01-markov-transport.yml'
  workflow_dispatch:
jobs:
  exact-cube-transport-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check source-scoped finite Markov/transport arithmetic
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/MarkovTransport.lean | tee mtb01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' mtb01-axioms.txt; then
            echo 'Admitted or native-reduction axiom detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mtb01-lean-axioms
          path: mtb01-axioms.txt
