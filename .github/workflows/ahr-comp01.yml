name: AHR-COMP-01 compact gauge and complexity oracle
on:
  pull_request:
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr_comp01/**'
      - '.github/workflows/ahr-comp01.yml'
  push:
    branches: [main]
    paths:
      - 'research/arithmetic_holonomy_rotor/ahr_comp01/**'
      - '.github/workflows/ahr-comp01.yml'
permissions:
  contents: read
jobs:
  compact-field-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: research/arithmetic_holonomy_rotor/ahr_comp01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verify.py --max-qubits 12 --output reproduced.json
      - uses: actions/upload-artifact@v4
        with:
          name: ahr-comp01-ci-receipt
          path: research/arithmetic_holonomy_rotor/ahr_comp01/reproduced.json
