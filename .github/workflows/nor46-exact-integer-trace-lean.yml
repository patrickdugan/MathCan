name: NOR-46 exact integer inverse uniqueness and full-trace root soundness

on:
  push:
    branches:
      - research/nor46-transparent-bigint-trace-20261118
    paths:
      - 'MathCan/NOR46ExactIntegerTrace.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor46-exact-integer-trace-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR46ExactIntegerTrace.lean'
      - 'MathCan.lean'
      - '.github/workflows/nor46-exact-integer-trace-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified_exact_integer_inverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check exact integer uniqueness and trusted-root proof composition
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR46ExactIntegerTrace.lean | tee nor46-exact-trace-axioms.txt
          if grep -Eq 'sorryAx|^error:|admit' nor46-exact-trace-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor46-lean-inverse-uniqueness-axioms
          path: nor46-exact-trace-axioms.txt
