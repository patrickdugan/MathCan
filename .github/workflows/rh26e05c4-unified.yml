name: RH-26E-05C4 unified numerical export

on:
  push:
    branches: [research/rh26-extraction-rubrics-20261123]
    paths:
      - 'research/rh26/lean/RH26E05C*.lean'
      - 'research/rh26/RH26E05C4_REGISTRATION.md'
      - '.github/workflows/rh26e05c4-unified.yml'
  workflow_dispatch:

concurrency:
  group: rh26e05c4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unified-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify registration, sources and toolchain
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.35.0' experiments/deligne_mathlib/lean-toolchain
          grep -Fx 'rev = "v4.35.0"' experiments/deligne_mathlib/lakefile.toml
          test -s research/rh26/RH26E05C4_REGISTRATION.md
          for mod in RH26E05C1Assembly RH26E05C2SmallRamified RH26E05C3Exceptional RH26E05C4Unified; do
            f="research/rh26/lean/$mod.lean"
            test -s "$f"
            if grep -En '\b(sorry|admit|native_decide)\b|^[[:space:]]*(axiom|unsafe|opaque)[[:space:]]' "$f"; then
              exit 1
            fi
          done
          for mod in RH26E05C1Assembly RH26E05C2SmallRamified RH26E05C3Exceptional; do
            git show 86d29f74bc051d7eee7f44e25ce94402e099d889:"research/rh26/lean/$mod.lean" | cmp - "research/rh26/lean/$mod.lean"
          done
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve Mathlib v4.35.0
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile four modules and audit 53 declarations
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/../../artifacts/rh26e05c4"
          BUILD="$PWD/.rh26e05c4"
          mkdir -p "$OUT" "$BUILD"
          export OUT BUILD
          git rev-parse HEAD | tee "$OUT/commit.txt"
          lean --version | tee "$OUT/lean-version.txt"
          grep -F 'Lean (version 4.35.0' "$OUT/lean-version.txt"
          git -C .lake/packages/mathlib rev-parse HEAD | tee "$OUT/mathlib-sha.txt"
          grep -Fx '56a005855ea17e0b0958f73ec801ae140b0a1679' "$OUT/mathlib-sha.txt"
          for mod in RH26E05C1Assembly RH26E05C2SmallRamified RH26E05C3Exceptional RH26E05C4Unified; do
            cp "../../research/rh26/lean/$mod.lean" "$BUILD/"
          done
          sha256sum "$BUILD/"*.lean | tee "$OUT/source-sha256.txt"
          lake env bash -c '
            set -euo pipefail
            export LEAN_PATH="$BUILD:${LEAN_PATH:-}"
            for mod in RH26E05C1Assembly RH26E05C2SmallRamified RH26E05C3Exceptional RH26E05C4Unified; do
              /usr/bin/time -v -o "$OUT/$mod.timing.txt" lean --root="$BUILD" -o "$BUILD/$mod.olean" "$BUILD/$mod.lean" 2>&1 | tee "$OUT/$mod.audit.txt"
            done
          '
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path("../../artifacts/rh26e05c4")
          registered = {
              "RH26E05C1Assembly": ("RH26E05C1", """
                  scale_nonneg original_absorption refined_absorption original_gap_identity
                  original_envelope original_integer_minimum refined_gap_identity refined_envelope
                  refined_integer_minimum original_assembly refined_assembly export_propagation
                  missing_scale_control negative_rank_control negative_padding_control
              """),
              "RH26E05C2SmallRamified": ("RH26E05C2", """
                  small_polynomial_expand small_gap_identity small_envelope small_integer_minimum
                  small_assembly row23_assembly conductor_log_budget conductor_pair_budget
                  pair_support_log_bound ramified_assembly conductor_sharp_fixture missing_conductor_factor_control
              """),
              "RH26E05C3Exceptional": ("RH26E05C3", """
                  cutoff_ratio denominator_envelope exceptional_divisions ep_bound flat_bound bb_bound
                  split_length inert_length exceptional_gap_identity exceptional_envelope exceptional_integer_minimum
                  pointwise_assembly count_mixed_bound count_envelope prime_log_bound exceptional_sum
                  exceptional_absorption missing_scale_controls
              """),
              "RH26E05C4Unified": ("RH26E05C4", """
                  priority_le_masks sum_mask five_mask_majorant exceptional_local exceptional_filtered
                  unified_point_bound unified_export overlap_control
              """),
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          total = 0
          for mod, (ns, names) in registered.items():
              expected = {ns+"."+n for n in names.split()}
              log = (base / (mod+".audit.txt")).read_text()
              assert "sorryAx" not in log and "ofReduceBool" not in log
              assert "declaration uses 'sorry'" not in log
              found = {}
              for line in log.splitlines():
                  match = re.fullmatch(r"'([^']+)' depends on axioms: \[([^]]*)\]", line.strip())
                  if match:
                      name, axioms = match.groups()
                      deps = {x.strip() for x in axioms.split(",") if x.strip()}
                  else:
                      match = re.fullmatch(r"'([^']+)' does not depend on any axioms", line.strip())
                      if not match:
                          continue
                      name, deps = match[1], set()
                  assert name not in found, name
                  assert deps <= allowed, (name, deps-allowed)
                  found[name] = deps
              assert set(found) == expected, (mod, expected-set(found), set(found)-expected)
              print(mod, len(found), "PASS")
              total += len(found)
          assert total == 53
          print("RH26E05C4: 53/53 registered declarations audited")
          PY
      - name: Preserve kernel receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh26e05c4-lean435-kernel-receipts
          path: artifacts/rh26e05c4/
          if-no-files-found: warn
          retention-days: 30
