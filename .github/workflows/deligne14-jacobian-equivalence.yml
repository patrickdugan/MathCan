name: DEL-14 sharp Jacobian ideal criterion

on:
  push:
    branches: [proof/deligne14-jacobian-equivalence-20261122]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/SharpJacobianIdeal.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'research/deligne_sign_audit/DEL14_*'
      - 'research/deligne_sign_audit/del14_*'
      - 'tests/test_deligne14_jacobian_equivalence.py'
      - '.github/workflows/deligne14-jacobian-equivalence.yml'
  workflow_dispatch:

concurrency:
  group: deligne14-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check sharp Jacobian ideal equivalence
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/SharpJacobianIdeal.lean | tee deligne14-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne14-axioms.txt; then
            echo 'DEL-14 admitted proof or unexpected reduction axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify DEL-14 exact Jacobian equivalence
        run: |
          set -euo pipefail
          if test -f tests/test_deligne14_jacobian_equivalence.py; then
            python -m unittest -v tests.test_deligne14_jacobian_equivalence
          fi
          if test -f research/deligne_sign_audit/del14_verify_tasks.py; then
            python -m research.deligne_sign_audit.del14_verify_tasks
          fi
