name: NOR-29 root-leakage information advantage Lean kernel

on:
  push:
    paths:
      - 'MathCan/NOR29EarlyEntropyGame.lean'
      - 'MathCan.lean'
      - 'research/nor29/**'
      - '.github/workflows/nor29-early-entropy-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR29EarlyEntropyGame.lean'
      - 'MathCan.lean'
      - 'research/nor29/**'
      - '.github/workflows/nor29-early-entropy-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-root-aware-game-and-commitment-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Lean kernel finite expectation inequality, strict witness, batch iff and binding
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR29EarlyEntropyGame.lean | tee nor29-early-root-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor29-early-root-axioms.txt; then
            echo 'NOR29 unexpected admitted proof or kernel error'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor29-root-aware-finite-game-lean-axioms
          path: nor29-early-root-axioms.txt
