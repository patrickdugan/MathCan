name: DEL-22E polynomial Schur numerator

on:
  push:
    branches: [proof/deligne22e-schur-numerator-20261123]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/PolynomialSchurNumerator.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'tests/test_deligne22e_schur_numerator.py'
      - 'research/deligne_sign_audit/DEL22E_*'
      - '.github/workflows/deligne22e-schur-numerator.yml'
  workflow_dispatch:

concurrency:
  group: deligne22e-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check Schur numerator and full Deligne04 umbrella
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/PolynomialSchurNumerator.lean | tee deligne22e-schur-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne22e-schur-axioms.txt; then
            echo 'DEL-22E unexpected axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay original scheme polynomial and extension-field regressions
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_deligne22e_schur_numerator tests.test_deligne22c_rankd_pivot tests.test_deligne22b_universal_section tests.test_deligne22a_relative_critical
