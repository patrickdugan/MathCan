name: DEL-21G geometric extension field Kähler

on:
  push:
    branches: [proof/deligne21g-geometric-fiber-20261122]
  pull_request:
    paths:
      - 'experiments/deligne_mathlib/Deligne04/GeometricKahlerFiber.lean'
      - 'experiments/deligne_mathlib/Deligne04.lean'
      - 'tests/test_deligne21g_geometric_fiber.py'
      - 'research/deligne_sign_audit/DEL21G_*'
      - '.github/workflows/deligne21g-geometric-fiber.yml'
  workflow_dispatch:

concurrency:
  group: deligne21g-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib 4.35
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check geometric quotient point and fiber
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake build Deligne04
          lake env lean Deligne04/GeometricKahlerFiber.lean | tee deligne21g-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' deligne21g-axioms.txt; then
            echo 'DEL-21G admitted proof or unexpected axiom'
            exit 1
          fi

  exact-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check genuine quadratic extension geometric points and Jacobians
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_deligne21g_geometric_fiber tests.test_deligne21f_actual_fiber
