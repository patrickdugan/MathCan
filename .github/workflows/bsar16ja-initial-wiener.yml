name: BSAR-16J-A initial Fourier-Wiener Galerkin tangent

on:
  pull_request:
    paths:
      - "experiments/bsar16/initial_wiener_tangent.py"
      - "experiments/bsar16/test_initial_wiener_tangent.py"
      - "research/bsar_audit/BSAR16JA_INITIAL_WIENER_TANGENT.md"
      - ".github/workflows/bsar16ja-initial-wiener.yml"
  push:
    branches: [main]
    paths:
      - "experiments/bsar16/initial_wiener_tangent.py"
      - "experiments/bsar16/test_initial_wiener_tangent.py"
      - ".github/workflows/bsar16ja-initial-wiener.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-initial-wiener:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source blob and syntax check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/bsar14_initial_triad_transfer.py)" = "aa25ad74be2347acf061d631f55338802eead212"
          python -m py_compile experiments/bsar16/initial_wiener_tangent.py experiments/bsar16/test_initial_wiener_tangent.py
      - name: Independent exact BSAR-14 source and weighted Fourier norm tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest experiments.bsar16.test_initial_wiener_tangent -v
      - name: Archive twelve source-pinned exact tangent certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bsar16ja
          python -m experiments.bsar16.initial_wiener_tangent generate --out artifacts/bsar16ja
          python -m experiments.bsar16.initial_wiener_tangent audit --out artifacts/bsar16ja
          python - <<'PY'
          import hashlib, json
          from fractions import Fraction as Q
          from pathlib import Path
          root=Path("artifacts/bsar16ja")
          data=(root/"rows.json").read_bytes()
          rows=json.loads(data)
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["rows"]==12 and manifest["nonzero_high_mode_cases"]==4
          assert hashlib.sha256(data).hexdigest()==manifest["rows_sha256"]
          for row in rows:
              active=(row["frequency_N"]==2 and row["grid_M"] in (16,24))
              assert row["nonzero_initial_high_defect"]==active
              if active:
                  assert Q(row["source_high_mode_L2_squared"])==Q(1,34)
                  assert Q(row["source_high_mode_A1_wiener_norm"])==2
                  assert Q(row["source_high_mode_curl_L2_squared"])==2
                  assert Q(row["source_high_mode_velocity_H4_squared"])==Q(69**4,34)
              else:
                  assert Q(row["source_high_mode_L2_squared"])==0
              assert not row["future_full_PDE_curl_bound_proved"]
              assert not row["future_full_PDE_H4_bound_proved"]
              assert not row["full_PDE_smooth_through_T_proved"]
          print("BSAR-16J-A exact 12 time-zero tangent certificates verified")
          PY
          sha256sum experiments/bsar16/initial_wiener_tangent.py > artifacts/bsar16ja/source.sha256
      - name: Preserve Gaussian-rational source-tangent receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsar16ja-exact-initial-wiener-tangent
          path: artifacts/bsar16ja/
          if-no-files-found: warn
          retention-days: 14
