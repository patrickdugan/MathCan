name: COE-01 chromatic observer Lean certificates

on:
  pull_request:
    paths:
      - 'MathCan/ChromaticObservers.lean'
      - 'MathCan.lean'
      - 'research/compactification/CHROMATIC_OBSERVER_THEOREM.md'
      - '.github/workflows/coe01-chromatic-observers.yml'
  push:
    branches: [main]
    paths:
      - 'MathCan/ChromaticObservers.lean'
      - 'MathCan.lean'
      - '.github/workflows/coe01-chromatic-observers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Independently check COE-01 target and axiom inventory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/ChromaticObservers.lean | tee coe01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' coe01-axioms.txt; then
            echo 'Unexpected admitted or native-reduction axiom'
            exit 1
          fi
