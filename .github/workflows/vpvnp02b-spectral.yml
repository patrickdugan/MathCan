name: VPVNP-02B spectral proof
on:
  push:
    branches: [research/vpvnp-01-spectral-geometry-20261124]
    paths:
      - 'research/VPVNP/RankSpectral.lean'
      - 'research/VPVNP/stability_check.py'
      - '.github/workflows/vpvnp02b-spectral.yml'
  pull_request:
    paths:
      - 'research/VPVNP/RankSpectral.lean'
      - 'research/VPVNP/stability_check.py'
      - '.github/workflows/vpvnp02b-spectral.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpvnp02b-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve existing pinned Mathlib project
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check orthogonal expansion, mixtures, and rank gap
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          lake env lean ../../research/VPVNP/RankSpectral.lean | tee "$RUNNER_TEMP/vpvnp02b-axioms.txt"
          python3 - "$RUNNER_TEMP/vpvnp02b-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set("orthogonal_energy shift_energy sign_energy weighted_bound weighted_ratio weighted_defect singleton_ratio rank_one_floor rank_two_floor full_rank_ceil rank_pointwise rank_nonextremal rank_one_attains sharp_lt_two".split())
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'VPVNP\.([\w]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'VPVNP\.([\w]+)' does not depend on any axioms",s):
              found.add(name)
          assert found==expected,(found,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpvnp02b-native-axioms
          path: ${{ runner.temp }}/vpvnp02b-axioms.txt
  exact-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/VPVNP/stability_check.py | tee "$RUNNER_TEMP/vpvnp02b-stability.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vpvnp02b-exact-stability
          path: ${{ runner.temp }}/vpvnp02b-stability.json
