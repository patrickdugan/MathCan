name: NOR-19 exact streamed coefficient checks and public-buffer workspace proof

on:
  push:
    paths:
      - 'MathCan/NOR19StreamedVerifier.lean'
      - 'MathCan.lean'
      - 'research/nor19/**'
      - '.github/workflows/nor19-streamed-memory-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR19StreamedVerifier.lean'
      - 'MathCan.lean'
      - 'research/nor19/**'
      - '.github/workflows/nor19-streamed-memory-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-streamed-exactness-and-buffer-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify pointwise/full-list exact parity and abstract 32-to-4-to-0 output materialization
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR19StreamedVerifier.lean | tee nor19-streamed-memory-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor19-streamed-memory-axioms.txt; then
            echo 'NOR19 unexpected admitted theorem or reduction marker'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor19-streamed-coefficients-buffer-workspace-axioms
          path: nor19-streamed-memory-axioms.txt
