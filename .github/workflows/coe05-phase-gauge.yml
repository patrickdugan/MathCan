name: COE-05 finite phase-gauge Lean certificates

on:
  pull_request:
    paths:
      - 'MathCan/PhaseGaugeCapacity.lean'
      - 'MathCan.lean'
      - 'research/compactification/PHASE_GAUGE_CAPACITY.md'
      - '.github/workflows/coe05-phase-gauge.yml'
  push:
    branches: [main, feat/coe01-chromatic-observer-20261115]
    paths:
      - 'MathCan/PhaseGaugeCapacity.lean'
      - 'MathCan.lean'
      - '.github/workflows/coe05-phase-gauge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check named COE-05 finite statements and transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/PhaseGaugeCapacity.lean | tee coe05-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' coe05-axioms.txt; then
            echo 'Unexpected admission or native code-evaluation axiom'
            exit 1
          fi
