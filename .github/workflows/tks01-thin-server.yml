name: TKS-01 thin spanning tree Lean kernel
permissions:
  contents: read
on:
  push:
    paths:
      - 'MathCan/ThinServer.lean'
      - '.github/workflows/tks01-thin-server.yml'
  pull_request:
    paths:
      - 'MathCan/ThinServer.lean'
      - '.github/workflows/tks01-thin-server.yml'
  workflow_dispatch:
jobs:
  thin-service-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-verify finite cuts and metric transfer, audit all axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/ThinServer.lean | tee tks01-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' tks01-axioms.txt; then
            echo 'Admitted or native-reduction axiom detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tks01-lean-axioms
          path: tks01-axioms.txt
