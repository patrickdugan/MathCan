name: NOR-32 nested audit coverage Lean 4.35 kernel

on:
  push:
    paths:
      - 'MathCan/NOR32NestedAuditCoverage.lean'
      - 'MathCan.lean'
      - 'research/nor32/**'
      - '.github/workflows/nor32-nested-coverage-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR32NestedAuditCoverage.lean'
      - 'MathCan.lean'
      - 'research/nor32/**'
      - '.github/workflows/nor32-nested-coverage-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monotone-unseen-and-zero-hit-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check four-coordinate batch evasion, total counts and fraction counterexample
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR32NestedAuditCoverage.lean | tee nor32-nested-batch-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor32-nested-batch-axioms.txt; then
            echo 'NOR32 Lean kernel failure or admitted proof'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor32-nested-batch-lean-axiom-inventory
          path: nor32-nested-batch-axioms.txt
