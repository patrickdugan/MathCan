name: RHD-12 exact residue prime-fiber certificates

on:
  push:
    paths:
      - 'MathCan/RHPrimeFibers.lean'
      - 'research/rh_proof_distillation/RHD12_PRIME_FIBERS.md'
      - '.github/workflows/rhd12-prime-fibers.yml'
  pull_request:
    paths:
      - 'MathCan/RHPrimeFibers.lean'
      - 'research/rh_proof_distillation/RHD12_PRIME_FIBERS.md'
      - '.github/workflows/rhd12-prime-fibers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-residue-fibers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Check finite quadratic quotients and transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/RHPrimeFibers.lean | tee rhd12-prime-fibers-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' rhd12-prime-fibers-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhd12-prime-fibers-axioms
          path: rhd12-prime-fibers-axioms.txt
          if-no-files-found: ignore
