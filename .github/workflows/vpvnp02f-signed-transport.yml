name: VPVNP-02F signed frame transport
# Historical per-stage gate; consolidated proof workflow runs on the PR.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: vpvnp02f-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mathlib-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib
        working-directory: experiments/deligne_mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check signed frame transport and axiom gate
        working-directory: experiments/deligne_mathlib
        shell: bash
        run: |
          set -euo pipefail
          cp ../../research/VPVNP/{RankSpectral,BinaryWalsh,HyperplaneCancellation,OrderedFrameFibers,SignedFrameTransport}.lean .
          lake env bash -c 'set -euo pipefail; export LEAN_PATH="$PWD:$LEAN_PATH"; for m in RankSpectral BinaryWalsh HyperplaneCancellation OrderedFrameFibers; do lean -o "$m.olean" "$m.lean"; done; lean SignedFrameTransport.lean' | tee "$RUNNER_TEMP/vpvnp02f-axioms.txt"
          python3 - "$RUNNER_TEMP/vpvnp02f-axioms.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          expected=set("normalPartition partition_card normal_card frame_card frame_sum_partition frame_fiber_sum outside_sum_subtype off_fiber_zero on_fiber_sign global_signed_sum actual_frame_reduction".split())
          found=set()
          assert not re.search(r"sorryAx|ofReduceBool|declaration uses 'sorry'|^error:",s,re.M),s
          for name,body in re.findall(r"'VPVNP\.Binary\.([\w]+)' depends on axioms: \[(.*?)\]",s,re.S):
              found.add(name)
              assert set(x.strip() for x in body.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'},(name,body)
          for name in re.findall(r"'VPVNP\.Binary\.([\w]+)' does not depend on any axioms",s):
              found.add(name)
          assert expected <= found,(found,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpvnp02f-native-axioms
          path: ${{ runner.temp }}/vpvnp02f-axioms.txt
  exact-signed-fibers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive arbitrary independent coefficient systems
        shell: bash
        run: |
          set -euo pipefail
          python3 research/VPVNP/signed_frame_check.py | tee "$RUNNER_TEMP/vpvnp02f-signed.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vpvnp02f-exact-signed
          path: ${{ runner.temp }}/vpvnp02f-signed.json
