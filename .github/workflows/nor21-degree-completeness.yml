name: NOR-21 kernel degree scaling, empty mask abstention and out-of-family future obstruction

on:
  push:
    paths:
      - 'MathCan/NOR21ObservationCompleteness.lean'
      - 'MathCan.lean'
      - 'research/nor21/**'
      - '.github/workflows/nor21-degree-completeness.yml'
  pull_request:
    paths:
      - 'MathCan/NOR21ObservationCompleteness.lean'
      - 'MathCan.lean'
      - 'research/nor21/**'
      - '.github/workflows/nor21-degree-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-degree-and-soundness-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Audit exact integer streaming, empty verification mask, counterfactual future and triangular recurrence
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR21ObservationCompleteness.lean | tee nor21-degree-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor21-degree-axioms.txt; then
            echo 'NOR21 unexpected admitted theorem or native reduction'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor21-degree-scaled-exact-public-verifier-axioms
          path: nor21-degree-axioms.txt
