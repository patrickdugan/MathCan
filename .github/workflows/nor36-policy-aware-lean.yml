name: NOR-36 policy-aware intra-atom curvature exact finite mathematics

on:
  push:
    paths:
      - 'MathCan/NOR36PolicyAwareCurvature.lean'
      - 'MathCan.lean'
      - 'research/nor36/**'
      - '.github/workflows/nor36-policy-aware-lean.yml'
  pull_request:
    paths:
      - 'MathCan/NOR36PolicyAwareCurvature.lean'
      - 'MathCan.lean'
      - 'research/nor36/**'
      - '.github/workflows/nor36-policy-aware-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-calibration-aware-reserve-and-public-prefix-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel-check exact calibrated-reserve count and adversarial counterexample
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/NOR36PolicyAwareCurvature.lean | tee nor36-policy-aware-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|^error:|admit' nor36-policy-aware-axioms.txt; then
            echo "NOR36 incomplete theorem"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nor36-policy-aware-lean-axioms
          path: nor36-policy-aware-axioms.txt
