name: SPC-03J finite quadratic endpoint-Jacobian certificates
on:
  push:
    paths:
      - 'MathCan/JacobianSecant.lean'
      - 'MathCan.lean'
      - 'research/spectral_aliasing/SPC-03J.md'
      - 'tests/test_jacobian_secant.py'
      - '.github/workflows/spc03-jacobian-secant.yml'
  pull_request:
    paths:
      - 'MathCan/JacobianSecant.lean'
      - 'MathCan.lean'
      - 'research/spectral_aliasing/SPC-03J.md'
      - 'tests/test_jacobian_secant.py'
      - '.github/workflows/spc03-jacobian-secant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rational-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_jacobian_secant.py -v
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: MathCan
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Reject admitting axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MathCan/JacobianSecant.lean | tee spc03j-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' spc03j-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spc03j-axiom-audit
          path: spc03j-axioms.txt
